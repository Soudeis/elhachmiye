<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Profil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
body{display:flex;justify-content:center;background:#000;}
.shell{width:100%;max-width:480px;min-height:100vh;background:linear-gradient(180deg,#1a0a0f 0%,#0d0010 40%,#0a0015 100%);display:flex;flex-direction:column;}

.topbar{padding:14px 16px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.4);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:10;}
.back{cursor:pointer;font-size:20px;background:none;border:none;color:white;padding:4px 8px 4px 0;}
.topbar h2{margin:0;font-size:17px;font-weight:700;color:white;flex:1;}

/* Photo grande */
.profile-photo-section{display:flex;flex-direction:column;align-items:center;padding:36px 20px 24px;}
.profile-big-photo{
  width:120px;height:120px;border-radius:50%;
  object-fit:cover;
  border:3px solid rgba(232,84,122,.5);
  box-shadow:0 0 40px rgba(232,84,122,.3);
}
.profile-big-initials{
  width:120px;height:120px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:48px;font-weight:700;color:white;
  border:3px solid rgba(232,84,122,.5);
  box-shadow:0 0 40px rgba(232,84,122,.3);
}
.profile-name{font-size:24px;font-weight:700;color:white;margin-top:16px;text-align:center;}
.profile-sub{font-size:14px;color:rgba(255,255,255,.4);margin-top:4px;}

/* Bouton message */
.action-row{display:flex;gap:12px;padding:0 20px 24px;justify-content:center;}
.action-btn{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:rgba(255,255,255,.08);border:none;border-radius:16px;
  padding:14px 24px;cursor:pointer;color:white;transition:.15s;
  flex:1;max-width:120px;
}
.action-btn:active{background:rgba(255,255,255,.14);}
.action-btn svg{width:22px;height:22px;}
.action-btn span{font-size:12px;font-weight:600;}

/* Infos */
.section-title{font-size:11px;font-weight:700;color:rgba(255,255,255,.35);padding:0 16px 8px;letter-spacing:.5px;}
.info-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.05);}
.info-icon{width:36px;height:36px;border-radius:50%;background:rgba(232,84,122,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.info-icon svg{width:18px;height:18px;color:#e8547a;}
.info-content{flex:1;}
.info-label{font-size:12px;color:rgba(255,255,255,.4);}
.info-value{font-size:15px;color:white;margin-top:2px;}

/* Médias partagés */
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:8px;}
.media-thumb{aspect-ratio:1;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.2);font-size:20px;cursor:pointer;overflow:hidden;}
.media-thumb img{width:100%;height:100%;object-fit:cover;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <button class="back" onclick="history.back()">←</button>
    <h2>Profil</h2>
  </div>

  <div class="profile-photo-section">
    <div id="profile-photo-el"></div>
    <div class="profile-name" id="profile-name"></div>
    <div class="profile-sub" id="profile-sub"></div>
  </div>

  <div class="action-row">
    <button class="action-btn" onclick="goToChat()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Message</span>
    </button>
  </div>

  <div class="section-title">INFORMATIONS</div>
  <div class="info-row">
    <div class="info-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div class="info-content">
      <div class="info-label">Nom complet</div>
      <div class="info-value" id="info-fullname"></div>
    </div>
  </div>
</div>

<script>
// Lire depuis localStorage
const data = JSON.parse(localStorage.getItem('viewProfile')||'null');
if(!data){ history.back(); }

const COLORS=['#e8547a','#9b59b6','#3498db','#e67e22','#2ecc71'];
const color=COLORS[Math.abs(parseInt(data.id||0))%COLORS.length];
const init=((data.prenom||'?')[0]+(data.nom||'?')[0]).toUpperCase();
const fullName=`${data.prenom||''} ${data.nom||''}`.trim();

// Photo
const photoEl=document.getElementById('profile-photo-el');
if(data.photo){
  photoEl.innerHTML=`<img class="profile-big-photo" src="${data.photo}"/>`;
} else {
  photoEl.innerHTML=`<div class="profile-big-initials" style="background:${color};">${init}</div>`;
}

document.getElementById('profile-name').textContent=fullName;
document.getElementById('info-fullname').textContent=fullName;

// Sous-titre
const sub=data.isGroup
  ? `${data.memberCount||''} membre${(data.memberCount||0)>1?'s':''}`
  : '';
document.getElementById('profile-sub').textContent=sub;

function goToChat(){
  // Si c'est un groupe → aller dans group-chat
  if(data.isGroup){
    localStorage.setItem('currentGroup',JSON.stringify({id:data.id,name:data.prenom}));
    window.location.href='group-chat.html';
  } else {
    localStorage.setItem('currentFriend',JSON.stringify(data));
    window.location.href='chat.html';
  }
}
</script>
</body>
</html>
