<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#1e90ff"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ChatApp"/>
<link rel="apple-touch-icon" href="icon.png"/>
<title>Rechercher</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;font-family:Arial,sans-serif;background:#f0f2f5;}
body{display:flex;justify-content:center;}
.shell{width:100%;max-width:480px;background:white;min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:#1e90ff;color:white;padding:14px 16px;display:flex;align-items:center;gap:10px;}
.back{cursor:pointer;font-size:22px;background:none;border:none;color:white;padding:4px 8px 4px 0;}
.topbar h2{font-size:16px;margin:0;}
.search-bar{padding:10px 14px;border-bottom:1px solid #f0f0f0;}
.search-bar input{width:100%;padding:9px 14px;border:1.5px solid #e8e8e8;border-radius:20px;font-size:14px;outline:none;background:#f8f8f8;}
.search-bar input:focus{border-color:#1e90ff;background:white;}
.list-area{flex:1;overflow-y:auto;}
.search-result{display:flex;align-items:center;padding:12px 16px;gap:12px;border-bottom:1px solid #f5f5f5;}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:white;flex-shrink:0;}
.friend-info{flex:1;}
.friend-name{font-size:15px;font-weight:600;color:#111;}
.add-btn{padding:7px 14px;border-radius:20px;border:1.5px solid #1e90ff;background:none;color:#1e90ff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.add-btn:hover{background:#1e90ff;color:white;}
.add-btn.sent{border-color:#ccc;color:#999;cursor:default;}
.add-btn.sent:hover{background:none;color:#999;}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ccc;gap:12px;font-size:14px;padding:40px;}
.empty-state svg{width:52px;height:52px;opacity:.35;}
.loader{text-align:center;padding:24px;color:#aaa;font-size:14px;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <button class="back" onclick="location.href='friends.html'">←</button>
    <h2>Ajouter un ami</h2>
  </div>
  <div class="search-bar">
    <input type="text" placeholder="Chercher par nom..." oninput="searchUsers(this.value)" autofocus/>
  </div>
  <div class="list-area" id="results">
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <span>Tape un nom pour chercher</span>
    </div>
  </div>
</div>

<script>
const API    = "https://didactic-disco-q795wwrqxg45c697p-8000.app.github.dev";
const WS_URL = "wss://didactic-disco-q795wwrqxg45c697p-8000.app.github.dev/ws";

const me = JSON.parse(localStorage.getItem('me'));
if (!me) window.location.href = 'index.html';

let ws = null;
let myFriendIds = [];

const COLORS = ['#1e90ff','#e74c3c','#2ecc71','#9b59b6','#f39c12','#16a085','#e67e22','#c0392b'];
const avatarColor = id => COLORS[Math.abs(parseInt(id||0)) % COLORS.length];
const initials = f => ((f.prenom||'?')[0]+(f.nom||'?')[0]).toUpperCase();

async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  try { return (await fetch(API+path, opts)).json(); }
  catch(e) { return {}; }
}

async function init() {
  const friends = await api('GET', `/friends/${me.id}`);
  myFriendIds = Array.isArray(friends) ? friends.map(f => String(f.id)) : [];
  connectWS();
}

function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => ws.send(JSON.stringify({ user_id: me.id }));
  ws.onclose = () => setTimeout(connectWS, 3000);
}

let searchTimeout;
async function searchUsers(q) {
  const results = document.getElementById('results');
  clearTimeout(searchTimeout);
  if (!q.trim()) {
    results.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><span>Tape un nom pour chercher</span></div>`;
    return;
  }
  results.innerHTML = '<div class="loader">Recherche...</div>';
  searchTimeout = setTimeout(async () => {
    const users = await api('GET', `/search-users?q=${encodeURIComponent(q)}`);
    const list = Array.isArray(users) ? users.filter(u => String(u.id) !== String(me.id)) : [];
    if (!list.length) { results.innerHTML = `<div class="empty-state"><span>Aucun résultat</span></div>`; return; }
    results.innerHTML = list.map(u => {
      const isFriend = myFriendIds.includes(String(u.id));
      return `
        <div class="search-result">
          <div class="avatar" style="background:${avatarColor(u.id)}">${initials(u)}</div>
          <div class="friend-info"><div class="friend-name">${u.prenom} ${u.nom}</div></div>
          <button class="add-btn${isFriend?' sent':''}" id="btn-${u.id}"
            ${isFriend?'':'onclick="sendReq(\''+u.id+'\')"'}>
            ${isFriend?'Ami ✓':'Ajouter'}
          </button>
        </div>`;
    }).join('');
  }, 400);
}

function sendReq(toId) {
  ws?.send(JSON.stringify({ action: 'friend_request', to: toId }));
  const btn = document.getElementById('btn-'+toId);
  if (btn) { btn.textContent = 'Demande envoyée'; btn.className = 'add-btn sent'; }
}

init();
</script>
</body>
</html>
