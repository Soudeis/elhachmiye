<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
body{display:flex;justify-content:center;background:#000;}
.shell{width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#1a0a0f 0%,#0d0010 40%,#1a0005 70%,#0a0015 100%);position:relative;overflow:hidden;}
.shell::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(180,50,80,.03) 2px,rgba(180,50,80,.03) 4px);pointer-events:none;z-index:0;}
.shell::after{content:'';position:absolute;width:300px;height:300px;background:radial-gradient(circle,rgba(220,80,120,.15) 0%,transparent 70%);top:30%;left:50%;transform:translateX(-50%);pointer-events:none;z-index:0;}
.topbar{position:relative;z-index:10;padding:14px 16px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.4);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}

.messages-area::-webkit-scrollbar{width:2px;}
.messages-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}
.bubble-wrapper{display:flex;flex-direction:column;margin-bottom:4px;}
.bubble-wrapper.me{align-items:flex-end;}
.bubble-wrapper.them{align-items:flex-start;}
.sender-name-label{font-size:11px;font-weight:700;margin-bottom:3px;padding-left:40px;}
.sender-row{display:flex;align-items:flex-end;gap:8px;}
.sender-avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;margin-bottom:2px;}
.sender-avatar-ph{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;flex-shrink:0;margin-bottom:2px;}
.bubble{max-width:78%;padding:10px 14px;border-radius:22px;font-size:15px;line-height:1.45;word-break:break-word;cursor:pointer;user-select:none;}
.bubble.me{background:linear-gradient(135deg,#e8547a,#c73b8a);color:white;border-bottom-right-radius:6px;}

.forwarded-label{font-size:11px;opacity:.6;margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.bubble-time{font-size:10px;margin-top:4px;opacity:.5;text-align:right;color:white;display:flex;align-items:center;justify-content:flex-end;gap:4px;}
.edited-tag{font-size:9px;font-style:italic;color:rgba(255,255,255,.6);}
.reactions-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.reaction-pill{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:3px 8px;font-size:13px;cursor:pointer;transition:.15s;user-select:none;}
.reaction-pill.mine{background:rgba(232,84,122,.25);border-color:rgba(232,84,122,.5);}
.reaction-pill:active{transform:scale(.92);}
.reaction-count{font-size:11px;color:rgba(255,255,255,.7);font-weight:600;}
.reply-preview{border-left:2px solid rgba(255,255,255,.5);padding:4px 8px;margin-bottom:6px;border-radius:4px;background:rgba(0,0,0,.2);font-size:11px;cursor:pointer;overflow:hidden;}
.reply-preview-name{font-weight:700;font-size:10px;margin-bottom:1px;opacity:.8;}

.vocal-player{display:flex;align-items:center;gap:10px;min-width:210px;max-width:260px;padding:4px 0;}
.vocal-play-btn{width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:white;font-size:14px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s;}
.vocal-play-btn:active{transform:scale(.92);}
.vocal-waveform{flex:1;height:40px;display:flex;align-items:center;gap:2px;cursor:pointer;overflow:hidden;}

.vocal-duration{font-size:11px;opacity:.6;flex-shrink:0;min-width:32px;text-align:right;color:white;}
.media-card-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:50px;cursor:pointer;transition:.15s;user-select:none;}
.media-card-btn.me{background:rgba(255,255,255,.25);}
.media-card-btn.them{background:rgba(255,255,255,.2);}

.media-card-play{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.media-card-play svg{width:12px;height:12px;fill:white;margin-left:2px;}
.media-card-label{font-size:16px;font-weight:700;color:rgba(0,0,0,.6);}
.typing-bubble{display:flex;gap:4px;align-items:center;padding:10px 14px;background:rgba(255,255,255,.12);border-radius:22px;border-bottom-left-radius:6px;align-self:flex-start;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);animation:bonce .9s infinite;}
.dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
@keyframes bonce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}
.reply-bar{display:none;padding:8px 14px;background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.08);flex-direction:row;align-items:center;gap:10px;flex-shrink:0;position:relative;z-index:10;}
.reply-bar.active{display:flex;}
.reply-bar-content{flex:1;min-width:0;}
.reply-bar-name{font-size:11px;font-weight:700;color:#e8547a;}
.reply-bar-text{font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reply-bar-cancel{background:none;border:none;color:rgba(255,255,255,.4);font-size:20px;cursor:pointer;}
.vocal-recording-bar{display:none;padding:12px 16px;background:linear-gradient(135deg,#e8547a,#c73b8a);flex-direction:row;align-items:center;gap:12px;flex-shrink:0;position:relative;z-index:10;border-radius:40px;margin:8px 12px;}
.vocal-recording-bar.active{display:flex;}
.rec-pause-btn{width:38px;height:38px;border-radius:50%;background:white;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;color:#e8547a;font-weight:700;}
.rec-waveform{flex:1;height:36px;display:flex;align-items:center;gap:2px;overflow:hidden;cursor:pointer;}
.rec-bar{width:3px;border-radius:3px;background:rgba(255,255,255,.5);min-height:4px;flex-shrink:0;}
.rec-timer-text{font-size:14px;font-weight:700;color:white;flex-shrink:0;min-width:36px;text-align:right;}
.vocal-recording-actions{display:none;padding:0 16px 12px;flex-direction:row;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;z-index:10;}

.rec-delete-btn{width:44px;height:44px;border-radius:50%;background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;}

.sticker-cat-btn{display:flex;align-items:center;gap:4px;padding:5px 12px;border-radius:20px;border:none;cursor:pointer;background:rgba(255,255,255,.08);color:rgba(255,255,255,.55);font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;transition:.15s;}

.sticker-section-title{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);padding:0 16px 6px;letter-spacing:.8px;flex-shrink:0;}
.sticker-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:110px;gap:10px;padding:4px 14px 14px;overflow-y:auto;flex:1;align-content:start;}

.sticker-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}

.input-row{padding:10px 12px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.5);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;position:relative;z-index:10;}

.media-btn svg{width:22px;height:22px;}
.media-btn.active-sticker{color:#e8547a;}
.input-wrap{flex:1;display:flex;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:0 14px;min-width:0;}
.msg-input{flex:1;background:none;border:none;outline:none;font-size:15px;color:white;padding:10px 0;}
.msg-input::placeholder{color:rgba(255,255,255,.35);}

.ctx-emoji-btn{font-size:26px;cursor:pointer;padding:4px;border-radius:50%;transition:transform .15s;background:none;border:none;}
.ctx-emoji-btn:active{transform:scale(1.3);}
.ctx-emoji-plus{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:18px;color:white;cursor:pointer;border:none;}
.ctx-menu{position:fixed;z-index:201;background:#2a2a2a;border-radius:16px;overflow:hidden;min-width:220px;box-shadow:0 8px 32px rgba(0,0,0,.5);}
.ctx-menu-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border:none;background:none;font-size:15px;color:white;cursor:pointer;width:100%;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);transition:background .1s;}
.ctx-menu-item:last-child{border-bottom:none;}
.ctx-menu-item:active{background:rgba(255,255,255,.08);}
.ctx-menu-item.danger{color:#ff4444;}
.ctx-menu-item svg{width:20px;height:20px;flex-shrink:0;opacity:.8;}
@keyframes highlight{0%{outline:3px solid rgba(232,84,122,.8);background:rgba(232,84,122,.15);}100%{outline:none;background:transparent;}}
.bubble.highlighted{animation:highlight 1.5s ease;}
.upload-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:white;font-size:15px;}
.upload-overlay.active{display:flex;}
.upload-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:#e8547a;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>

<div class="shell">
  <div class="topbar">
    <button class="back" onclick="location.href='friends.html'">←</button>
    <div id="group-avatar-top" style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#e8547a,#c73b8a);display:flex;align-items:center;justify-content:center;font-size:16px;color:white;font-weight:700;flex-shrink:0;cursor:pointer;" onclick="location.href='group-info.html'"></div>

<script>
const API       = "https://didactic-disco-q795wwrqxg45c697p-8000.app.github.dev";
const WS_URL    = "wss://didactic-disco-q795wwrqxg45c697p-8000.app.github.dev/ws";
const GIPHY_KEY = "rO0Vv1XhZjF8umABjU2poD88Ua0Q6C9r";
const EDIT_LIMIT_MS = 7 * 60 * 1000;
const QUICK_EMOJIS  = ['❤️','😂','😮','😢','😡','👍'];
const MEMBER_COLORS = ['#e8547a','#9b59b6','#3498db','#e67e22','#2ecc71','#e74c3c','#1abc9c'];
const BAR_COUNT = 30;

const me    = JSON.parse(localStorage.getItem('me'));
const group = JSON.parse(localStorage.getItem('currentGroup'));
if(!me||!group) window.location.href='groups.html';

document.getElementById('group-name-top').textContent = group.name;
document.getElementById('group-avatar-top').textContent = group.name[0].toUpperCase();

let messages=[], ws=null, members=[], replyingTo=null, editingMsgId=null, typingTimer=null, isTypingSent=false;

function memberColor(userId){ return MEMBER_COLORS[Math.abs(parseInt(userId||0))%MEMBER_COLORS.length]; }

async function loadMembers(){
  const res=await fetch(`${API}/group/${group.id}/members`);
  members=await res.json();
  const accepted=members.filter(m=>m.status==='accepted');
  document.getElementById('members-count').textContent=`${accepted.length} membre${accepted.length>1?'s':''}`;
}
async function loadGroupInfo(){
  const res = await fetch(`${API}/group/${group.id}/info`);
  const info = await res.json();
  if(info && info.photo){
    group.photo = info.photo;
    localStorage.setItem('currentGroup', JSON.stringify(group));
    const avatarEl = document.getElementById('group-avatar-top');
    avatarEl.innerHTML = `<img src="${info.photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;"/>`;
    avatarEl.textContent = '';
  }
}
// ════════════════════════════════════════════
// WAVEFORM — barres déterministes
// ════════════════════════════════════════════
const waveCache={};
function generateWaveBars(seed,count){
  let hash=0;
  for(let i=0;i<seed.length;i++){hash=Math.imul(31,hash)+seed.charCodeAt(i)|0;}
  const bars=[];
  for(let i=0;i<count;i++){
    const sine=Math.sin(i*0.8+(hash&0xff)*0.02)*10;
    const sine2=Math.sin(i*0.3+((hash>>8)&0xff)*0.04)*6;
    const hVal=Math.abs(Math.imul(hash^(i*2246822519),2654435761))>>>0;
    const pseudo=(hVal%12);
    const h=Math.round(Math.max(4,Math.min(28,14+sine+sine2+pseudo)));
    bars.push(h);
  }
  return bars;
}
function getBars(uid){
  if(!waveCache[uid]) waveCache[uid]=generateWaveBars(String(uid),BAR_COUNT);
  return waveCache[uid];
}

// ════════════════════════════════════════════
// WEBSOCKET
// ════════════════════════════════════════════
function connectWS(){
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{
    ws.send(JSON.stringify({user_id:me.id}));
    ws.send(JSON.stringify({action:'group_get_history',group_id:group.id}));
  };
  ws.onmessage=e=>{
    const data=JSON.parse(e.data);
    if(data.action==='group_history'&&String(data.group_id)===String(group.id)){
      messages=(data.messages||[]).map(m=>({
        from:String(m.from),text:m.text||'',
        media_url:m.media_url||null,media_type:m.media_type||null,
        is_vocal:m.is_vocal||false,time:m.time,msg_id:m.msg_id,
        edited:m.edited===1||m.edited===true,
        created_at:m.created_at||null,
        is_forwarded:m.is_forwarded===1||m.is_forwarded===true,
        sender_nom:m.sender_nom,sender_prenom:m.sender_prenom,sender_photo:m.sender_photo,
        reply_to_id:m.reply_to_id||null,reply_to_text:m.reply_to_text||null,
        reply_to_type:m.reply_to_type||null,reply_to_from:m.reply_to_from||null,
        reactions:m.reactions||[],
      }));
      renderMessages();
    }
    else if(data.action==='group_new_message'&&String(data.group_id)===String(group.id)){
      messages.push({
        from:String(data.from),text:data.text||'',
        media_url:data.media_url||null,media_type:data.media_type||null,
        is_vocal:data.is_vocal||false,time:data.time,msg_id:data.msg_id,
        edited:false,created_at:data.created_at||null,
        is_forwarded:data.is_forwarded||false,
        sender_nom:data.sender_nom,sender_prenom:data.sender_prenom,sender_photo:data.sender_photo,
        reply_to_id:data.reply_to_id||null,reply_to_text:data.reply_to_text||null,
        reply_to_type:data.reply_to_type||null,reply_to_from:data.reply_to_from||null,
        reactions:[],
      });
      renderMessages();
    }
    else if(data.action==='group_message_deleted'&&String(data.group_id)===String(group.id)){
      messages=messages.filter(m=>m.msg_id!==data.msg_id);renderMessages();
    }
    else if(data.action==='message_edited'){
      const m=messages.find(m=>m.msg_id===data.msg_id);
      if(m){m.text=data.text;m.edited=true;renderMessages();}
    }
    else if(data.action==='edit_error'){showToast(data.msg||'Modification impossible');cancelEdit();}
    else if(data.action==='message_reaction'){
      const m=messages.find(m=>m.msg_id===data.msg_id);
      if(m){
        m.reactions=m.reactions.filter(r=>r.user_id!==String(data.user_id));
        m.reactions.push({emoji:data.emoji,user_id:String(data.user_id)});
        renderMessages();
      }
    }
    else if(data.action==='reaction_removed'){
      const m=messages.find(m=>m.msg_id===data.msg_id);
      if(m){m.reactions=m.reactions.filter(r=>!(r.user_id===String(data.user_id)&&r.emoji===data.emoji));renderMessages();}
    }
    else if(data.action==='group_member_joined'){loadMembers();}
    else if(data.action==='group_removed'&&String(data.group_id)===String(group.id)){
      alert('Vous avez été retiré de ce groupe');
      window.location.href='groups.html';
    }
    else if(data.action==='typing'&&data.group_id&&String(data.group_id)===String(group.id)){
      showTyping(data.is_typing,data.from);
    }
  };
  ws.onclose=()=>setTimeout(connectWS,3000);
}

// ════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════
function renderMessages(){
  const area=document.getElementById('messages-area');
  area.innerHTML=messages.map((m,i)=>{
    const isMe=String(m.from)===String(me.id);
    const isSticker=m.media_type==='sticker';
    const replyHTML=m.reply_to_id?buildReplyPreview(m):'';
    const content=buildContent(m,isMe);
    const editedTag=m.edited?`<span class="edited-tag">· modifié</span>`:'';
    const fwdLabel=m.is_forwarded?`<div class="forwarded-label"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 10 20 15 15 20"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/></svg> Transféré</div>`:'';
    const reactionsHTML=buildReactionsHTML(m,isMe);
    if(isMe){
      return `<div class="bubble-wrapper me">
        <div class="bubble me${isSticker?' sticker-bubble':''}" id="msg_${m.msg_id}"
          oncontextmenu="openMenu(event,${i})"
          ontouchstart="touchStart(event,${i})" ontouchend="touchEnd()">
          ${fwdLabel}${replyHTML}${content}
          ${!isSticker?`<div class="bubble-time">${m.time||''}${editedTag}</div>`:''}
        </div>
        ${reactionsHTML}
      </div>`;
    } else {
      const color=memberColor(m.from);
      const senderName=`${m.sender_prenom||''} ${m.sender_nom||''}`.trim();
      const avatarEl=m.sender_photo
        ?`<img class="sender-avatar" src="${m.sender_photo}"/>`
        :`<div class="sender-avatar-ph" style="background:${color};">${(m.sender_prenom||'?')[0].toUpperCase()}</div>`;
      return `<div class="bubble-wrapper them">
        <div class="sender-name-label" style="color:${color};">${senderName}</div>
        <div class="sender-row">
          ${avatarEl}
          <div style="min-width:0;">
            <div class="bubble them${isSticker?' sticker-bubble':''}" id="msg_${m.msg_id}"
              oncontextmenu="openMenu(event,${i})"
              ontouchstart="touchStart(event,${i})" ontouchend="touchEnd()">
              ${fwdLabel}${replyHTML}${content}
              ${!isSticker?`<div class="bubble-time">${m.time||''}${editedTag}</div>`:''}
            </div>
            ${reactionsHTML}
          </div>
        </div>
      </div>`;
    }
  }).join('');
  area.scrollTop=area.scrollHeight;
  document.querySelectorAll('.vocal-waveform').forEach(el=>{
    el.addEventListener('click',e=>{
      const uid=el.dataset.uid;
      const audio=document.getElementById('audio_'+uid);
      if(!audio||!audio.duration)return;
      const rect=el.getBoundingClientRect();
      audio.currentTime=((e.clientX-rect.left)/rect.width)*audio.duration;
    });
  });
}

function buildReactionsHTML(m,isMe){
  if(!m.reactions||!m.reactions.length)return '';
  const groups={};
  m.reactions.forEach(r=>{
    if(!groups[r.emoji])groups[r.emoji]={count:0,mine:false};
    groups[r.emoji].count++;
    if(r.user_id===String(me.id))groups[r.emoji].mine=true;
  });
  const pills=Object.entries(groups).map(([emoji,g])=>
    `<div class="reaction-pill${g.mine?' mine':''}" onclick="toggleReaction('${m.msg_id}','${emoji}')">
      <span>${emoji}</span>${g.count>1?`<span class="reaction-count">${g.count}</span>`:''}
    </div>`
  ).join('');
  return `<div class="reactions-row" style="${isMe?'justify-content:flex-end;':'justify-content:flex-start;margin-left:38px;'}">${pills}</div>`;
}

function buildContent(m,isMe){
  if(m.media_type==='sticker'){
    return `<img src="${m.media_url}" alt="sticker" style="width:140px;height:140px;object-fit:contain;display:block;" loading="lazy"/>`;
  }
  if(m.media_type==='image'){
    const mJson=encodeURIComponent(JSON.stringify(m));
    return `<div class="media-card-btn ${isMe?'me':'them'}" onclick="openViewerEncoded('${mJson}')">
      <div class="media-card-play"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
      <span class="media-card-label">Photo</span></div>`;
  }
  if(m.media_type==='video'){
    const mJson=encodeURIComponent(JSON.stringify(m));
    return `<div class="media-card-btn ${isMe?'me':'them'}" onclick="openViewerEncoded('${mJson}')">
      <div class="media-card-play"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
      <span class="media-card-label">Vidéo</span></div>`;
  }
  if(m.media_type==='audio'){
    const uid=String(m.msg_id||Date.now());
    const bars=getBars(uid);
    const barsHTML=bars.map(h=>`<div class="vocal-bar" data-h="${h}" style="height:${h}px;"></div>`).join('');
    return `<div class="vocal-player">
      <button class="vocal-play-btn" onclick="toggleVocal('${uid}')">▶</button>
      <audio id="audio_${uid}" src="${m.media_url}" preload="auto"
        ontimeupdate="updateVocalBar('${uid}')" onended="resetVocal('${uid}')"></audio>
      <div class="vocal-waveform" data-uid="${uid}">${barsHTML}</div>
      <span class="vocal-duration" id="dur_${uid}">0:00</span>
    </div>`;
  }
  return `<span>${m.text}</span>`;
}

// ════════════════════════════════════════════
// AUDIO
// ════════════════════════════════════════════
function toggleVocal(uid){
  const audio=document.getElementById('audio_'+uid);
  const btn=audio?.previousElementSibling;
  if(!audio)return;
  if(audio.paused){
    document.querySelectorAll('audio').forEach(a=>{if(a!==audio){a.pause();resetVocalBtn(a.id.replace('audio_',''));}});
    audio.play().then(()=>{
      if(btn)btn.textContent='⏸';
      const m=messages.find(m=>String(m.msg_id)===String(uid));
      const name=String(m?.from)===String(me.id)?'Toi':(m?.sender_prenom||'Vocal');
      localStorage.setItem('currentAudio',JSON.stringify({
        url:audio.src,name,photo:null,
        position:audio.currentTime,
        chatId:'group_'+String(group.id),
      }));
    }).catch(()=>{});
  } else {
    audio.pause();
    if(btn)btn.textContent='▶';
    const state=JSON.parse(localStorage.getItem('currentAudio')||'null');
    if(state&&state.chatId==='group_'+String(group.id)){
      state.position=audio.currentTime;
      localStorage.setItem('currentAudio',JSON.stringify(state));
    }
  }
}
function updateVocalBar(uid){
  const audio=document.getElementById('audio_'+uid);
  if(!audio||!audio.duration)return;
  const pct=audio.currentTime/audio.duration;
  const played=Math.floor(pct*BAR_COUNT);
  const waveEl=document.querySelector(`.vocal-waveform[data-uid="${uid}"]`);
  if(waveEl){
    waveEl.querySelectorAll('.vocal-bar').forEach((bar,i)=>{
      const h=bar.dataset.h||'14';
      bar.style.height=h+'px';
      if(i<played)        bar.className='vocal-bar played';
      else if(i===played) bar.className='vocal-bar active';
      else                bar.className='vocal-bar';
    });
  }
  const dur=document.getElementById('dur_'+uid);
  if(dur){const s=Math.floor(audio.currentTime);dur.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
  const state=JSON.parse(localStorage.getItem('currentAudio')||'null');
  if(state&&state.chatId==='group_'+String(group.id)){
    state.position=audio.currentTime;
    localStorage.setItem('currentAudio',JSON.stringify(state));
  }
}
function resetVocal(uid){
  resetVocalBtn(uid);
  const audio=document.getElementById('audio_'+uid);if(audio)audio.currentTime=0;
  const waveEl=document.querySelector(`.vocal-waveform[data-uid="${uid}"]`);
  if(waveEl){
    waveEl.querySelectorAll('.vocal-bar').forEach(bar=>{
      const h=bar.dataset.h||'14';
      bar.style.height=h+'px';
      bar.className='vocal-bar';
    });
  }
  const dur=document.getElementById('dur_'+uid);if(dur)dur.textContent='0:00';
}
function resetVocalBtn(uid){
  const audio=document.getElementById('audio_'+uid);
  const btn=audio?.previousElementSibling;if(btn)btn.textContent='▶';
}

function openViewer(m){
  localStorage.setItem('viewerMedia',JSON.stringify({url:m.media_url,type:m.media_type,from:String(m.from)===String(me.id)?'Toi':(m.sender_prenom||''),time:m.time}));
  window.location.href='viewer.html';
}
function openViewerEncoded(encoded){openViewer(JSON.parse(decodeURIComponent(encoded)));}

function buildReplyPreview(m){
  const fromName=m.reply_to_from===String(me.id)?'Toi':(m.sender_prenom||'');
  let txt=m.reply_to_text||'';
  if(!txt){if(m.reply_to_type==='image')txt='📷 Photo';else if(m.reply_to_type==='video')txt='🎥 Vidéo';else if(m.reply_to_type==='audio')txt='🎵 Vocal';else if(m.reply_to_type==='sticker')txt='🎭 Sticker';}
  return `<div class="reply-preview" onclick="scrollToMessage('${m.reply_to_id}',event)">
    <div class="reply-preview-name">${fromName}</div>
    <div class="reply-preview-text">${txt}</div></div>`;
}
function scrollToMessage(msgId,event){
  event.stopPropagation();
  const el=document.getElementById('msg_'+msgId);if(!el)return;
  const area=document.getElementById('messages-area');
  area.scrollTo({top:el.offsetTop-area.clientHeight/2+el.clientHeight/2,behavior:'smooth'});
  el.classList.remove('highlighted');void el.offsetWidth;
  el.classList.add('highlighted');setTimeout(()=>el.classList.remove('highlighted'),1500);
}
function cancelReply(){
  replyingTo=null;
  document.getElementById('reply-bar').classList.remove('active');
  document.getElementById('reply-bar-icon').textContent='↩';
  document.getElementById('reply-bar-cancel-btn').onclick=cancelReply;
}
function toggleReaction(msgId,emoji){
  ws?.send(JSON.stringify({action:'react_message',group_id:group.id,msg_id:msgId,emoji}));
}

// ════════════════════════════════════════════
// MENU CONTEXTUEL
// ════════════════════════════════════════════
let touchTimer=null;
function touchStart(event,idx){touchTimer=setTimeout(()=>openMenu(null,idx),500);}
function touchEnd(){clearTimeout(touchTimer);}
function closeMenu(){
  document.getElementById('ctx-overlay')?.remove();
  document.getElementById('ctx-emoji-bar')?.remove();
  document.getElementById('ctx-menu')?.remove();
}
function openMenu(event,idx){
  if(event)event.preventDefault();
  const m=messages[idx];if(!m)return;
  const isMe=String(m.from)===String(me.id);
  closeMenu();
  const overlay=document.createElement('div');
  overlay.className='ctx-overlay';overlay.id='ctx-overlay';overlay.onclick=closeMenu;
  document.body.appendChild(overlay);
  const emojiBar=document.createElement('div');
  emojiBar.className='ctx-emoji-bar';emojiBar.id='ctx-emoji-bar';
  QUICK_EMOJIS.forEach(emoji=>{
    const btn=document.createElement('button');btn.className='ctx-emoji-btn';btn.textContent=emoji;
    btn.onclick=()=>{closeMenu();toggleReaction(m.msg_id,emoji);};
    emojiBar.appendChild(btn);
  });
  const plusBtn=document.createElement('button');
  plusBtn.className='ctx-emoji-plus';plusBtn.textContent='+';plusBtn.onclick=()=>{closeMenu();};
  emojiBar.appendChild(plusBtn);
  document.body.appendChild(emojiBar);
  const menu=document.createElement('div');menu.className='ctx-menu';menu.id='ctx-menu';
  const menuItems=[
    {label:'Répondre',icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>`,
      action:()=>{
        closeMenu();
        replyingTo={msg_id:m.msg_id,from:m.from,text:m.text,media_type:m.media_type};
        const fromName=isMe?'Toi':(m.sender_prenom||'');
        let txt=m.text||'';
        if(!txt){if(m.media_type==='image')txt='📷 Photo';else if(m.media_type==='video')txt='🎥 Vidéo';else if(m.media_type==='audio')txt='🎵 Vocal';else if(m.media_type==='sticker')txt='🎭 Sticker';}
        document.getElementById('reply-bar-icon').textContent='↩';
        document.getElementById('reply-bar-name').textContent=fromName;
        document.getElementById('reply-bar-text').textContent=txt;
        document.getElementById('reply-bar').classList.add('active');
        document.getElementById('reply-bar-cancel-btn').onclick=cancelReply;
        document.getElementById('msg-input').focus();
      }
    },
  ];
  if(isMe&&!m.media_url&&canEdit(m)){
    menuItems.push({label:'Modifier',icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
      action:()=>{closeMenu();startEdit(m.msg_id,m.text);}
    });
  }
  if(isMe){
    menuItems.push({label:'Supprimer',icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>`,danger:true,
      action:()=>{closeMenu();deleteGroupMessage(m.msg_id);}
    });
  }
  menuItems.forEach(item=>{
    const btn=document.createElement('button');
    btn.className='ctx-menu-item'+(item.danger?' danger':'');
    btn.innerHTML=`${item.icon}<span>${item.label}</span>`;
    btn.onclick=item.action;
    menu.appendChild(btn);
  });
  document.body.appendChild(menu);
  requestAnimationFrame(()=>{
    const bubbleEl=document.getElementById('msg_'+m.msg_id);
    const rect=bubbleEl?bubbleEl.getBoundingClientRect():{top:200,bottom:240};
    const windowH=window.innerHeight;
    const emojiH=emojiBar.offsetHeight||60;
    const menuH=menu.offsetHeight||200;
    const totalH=emojiH+8+menuH;
    const spaceBelow=windowH-rect.bottom;
    const spaceAbove=rect.top;
    let topPos;
    if(spaceBelow>totalH+20) topPos=rect.bottom+10;
    else if(spaceAbove>totalH+20) topPos=rect.top-totalH-10;
    else topPos=Math.max(20,(windowH-totalH)/2);
    emojiBar.style.top=topPos+'px';emojiBar.style.left='50%';emojiBar.style.transform='translateX(-50%)';
    menu.style.top=(topPos+emojiH+8)+'px';menu.style.left='50%';menu.style.transform='translateX(-50%)';
  });
}

function deleteGroupMessage(msgId){
  ws?.send(JSON.stringify({action:'group_delete_message',group_id:group.id,msg_id:msgId}));
  messages=messages.filter(m=>m.msg_id!==msgId);renderMessages();
}

// ════════════════════════════════════════════
// MODIFIER
// ════════════════════════════════════════════
function canEdit(m){
  if(!m.created_at)return true;
  return (Date.now()-new Date(m.created_at).getTime())<EDIT_LIMIT_MS;
}
function startEdit(msgId,currentText){
  const m=messages.find(m=>m.msg_id===msgId);if(!m)return;
  if(!canEdit(m)){showToast('Impossible de modifier un message de plus de 7 min');return;}
  editingMsgId=msgId;
  const input=document.getElementById('msg-input');input.value=currentText;input.focus();
  document.getElementById('reply-bar-icon').textContent='✏️';
  document.getElementById('reply-bar-name').textContent='Modifier le message';
  document.getElementById('reply-bar-text').textContent=currentText;
  document.getElementById('reply-bar').classList.add('active');
  document.getElementById('reply-bar-cancel-btn').onclick=cancelEdit;
  document.getElementById('send-btn').style.color='#f39c12';
}
function confirmEdit(){
  const input=document.getElementById('msg-input');
  const newText=input.value.trim();if(!newText||!editingMsgId)return;
  const m=messages.find(m=>m.msg_id===editingMsgId);
  if(m&&!canEdit(m)){showToast('Délai de 7 min dépassé');cancelEdit();return;}
  if(m){m.text=newText;m.edited=true;}
  renderMessages();
  if(!ws||ws.readyState!==WebSocket.OPEN){showToast('Connexion perdue');cancelEdit();return;}
  ws.send(JSON.stringify({action:'edit_message',group_id:group.id,msg_id:editingMsgId,text:newText}));
  cancelEdit();
}
function cancelEdit(){
  editingMsgId=null;
  document.getElementById('msg-input').value='';
  document.getElementById('reply-bar').classList.remove('active');
  document.getElementById('reply-bar-icon').textContent='↩';
  document.getElementById('reply-bar-cancel-btn').onclick=cancelReply;
  document.getElementById('send-btn').style.color='#e8547a';
}
function showToast(msg){
  const ex=document.getElementById('toast');if(ex)ex.remove();
  const t=document.createElement('div');t.id='toast';t.textContent=msg;
  t.style.cssText='position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:white;padding:10px 18px;border-radius:20px;font-size:13px;z-index:400;white-space:nowrap;border:1px solid rgba(255,255,255,.1);';
  document.body.appendChild(t);setTimeout(()=>t.remove(),2500);
}

// ════════════════════════════════════════════
// ENVOYER TEXTE
// ════════════════════════════════════════════
function sendMessage(){
  if(editingMsgId){confirmEdit();return;}
  const input=document.getElementById('msg-input');
  const text=input.value.trim();if(!text)return;
  const now=new Date(),time=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  const tempId=`g${group.id}_${me.id}_${Date.now()}`;
  messages.push({
    from:String(me.id),text,media_url:null,media_type:null,
    is_vocal:false,edited:false,time,msg_id:tempId,
    created_at:new Date().toISOString(),is_forwarded:false,
    sender_nom:me.nom,sender_prenom:me.prenom,sender_photo:me.photo,
    reply_to_id:replyingTo?.msg_id||null,reply_to_text:replyingTo?.text||null,
    reply_to_type:replyingTo?.media_type||null,reply_to_from:replyingTo?.from||null,
    reactions:[],
  });
  renderMessages();input.value='';
  ws?.send(JSON.stringify({
    action:'group_send_message',group_id:group.id,text,
    reply_to_id:replyingTo?.msg_id||null,reply_to_text:replyingTo?.text||null,
    reply_to_type:replyingTo?.media_type||null,reply_to_from:replyingTo?.from||null,
  }));
  cancelReply();clearTypingState();
}

// ════════════════════════════════════════════
// UPLOAD
// ════════════════════════════════════════════
async function uploadAndSend(file,isVocal=false){
  document.getElementById('upload-overlay').classList.add('active');
  document.getElementById('send-btn').disabled=true;
  try{
    const fd=new FormData();fd.append('file',file);
    const res=await fetch(`${API}/upload`,{method:'POST',body:fd});
    const data=await res.json();
    if(!data.url){alert('Erreur upload.');return;}
    const now=new Date(),time=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
    const tempId=`g${group.id}_${me.id}_${Date.now()}`;
    messages.push({
      from:String(me.id),text:'',media_url:data.url,media_type:data.media_type,
      is_vocal:isVocal,edited:false,time,msg_id:tempId,

// ENREGISTREMENT VOCAL — vague sinusoïde fluide
// ════════════════════════════════════════════
let mediaRecorder=null,audioChunks=[],recordingStream=null;
let recTimerInterval=null,recSeconds=0,recWaveInterval=null;
let pendingBlob=null,pendingBlobUrl=null,previewAudio=null;
let recState='idle',wavePhase=0;

function initRecWaveform(){
  const waveEl=document.getElementById('rec-waveform');
  waveEl.innerHTML='';
  for(let i=0;i<40;i++){
    const bar=document.createElement('div');
    bar.className='rec-bar';bar.style.height='4px';
    waveEl.appendChild(bar);
  }
  wavePhase=0;
}

function animateRecWaveform(){
  if(recState!=='recording')return;
  wavePhase+=0.15;
  const bars=document.querySelectorAll('.rec-bar');
  bars.forEach((bar,i)=>{
    const v1=Math.sin(wavePhase+i*0.35)*0.5+0.5;
    const v2=Math.sin(wavePhase*0.7+i*0.6)*0.25;
    const v=Math.max(0.05,Math.min(1,v1+v2));
    bar.style.height=Math.round(4+v*28)+'px';
    bar.style.background=`rgba(255,255,255,${(0.3+v*0.6).toFixed(2)})`;
  });
}

async function startRecording(e){
  if(e)e.preventDefault();
  if(recState!=='idle')return;
  try{
    recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mimeType=MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'';
    mediaRecorder=mimeType?new MediaRecorder(recordingStream,{mimeType}):new MediaRecorder(recordingStream);
    audioChunks=[];recSeconds=0;pendingBlob=null;pendingBlobUrl=null;
    mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.onstop=()=>{
      recordingStream.getTracks().forEach(t=>t.stop());
      const finalType=mediaRecorder.mimeType||'audio/webm';
      const finalExt=finalType.includes('mp4')?'mp4':'webm';
      pendingBlob=new Blob(audioChunks,{type:finalType});
      pendingBlob._ext=finalExt;pendingBlob._type=finalType;
      if(pendingBlobUrl)URL.revokeObjectURL(pendingBlobUrl);
      pendingBlobUrl=URL.createObjectURL(pendingBlob);
      startPreview();
    };
    mediaRecorder.start(100);recState='recording';
    initRecWaveform();
    document.getElementById('vocal-recording-bar').classList.add('active');
    document.getElementById('vocal-recording-actions').classList.add('active');
    document.getElementById('input-row').style.display='none';
    document.getElementById('rec-pause-btn').textContent='⏸';
    recTimerInterval=setInterval(()=>{
      if(recState==='recording'){
        recSeconds++;
        const m=Math.floor(recSeconds/60),s=recSeconds%60;
        document.getElementById('rec-timer').textContent=`${m}:${String(s).padStart(2,'0')}`;
      }
    },1000);
    recWaveInterval=setInterval(animateRecWaveform,50);
    document.getElementById('vocal-btn').classList.add('recording');
  }catch(e){alert('Accès au microphone refusé.');}
}

function onMicRelease(){}

function togglePausePlay(){
  const btn=document.getElementById('rec-pause-btn');
  if(recState==='recording'){
    clearInterval(recTimerInterval);clearInterval(recWaveInterval);
    document.getElementById('vocal-btn').classList.remove('recording');
    mediaRecorder.stop();btn.textContent='⏳';
  } else if(recState==='preview_playing'){
    previewAudio?.pause();
    clearInterval(window._previewInterval);
    recState='preview_paused';btn.textContent='▶';
  } else if(recState==='preview_paused'){
    startPreview();
  }
}

function startPreview(){
  if(!pendingBlobUrl)return;
  const btn=document.getElementById('rec-pause-btn');
  if(!window._previewBars){
    window._previewBars=generateWaveBars('preview_fixed',40);
  }
  const previewBars=window._previewBars;
  const waveEl=document.getElementById('rec-waveform');
  if(previewAudio){previewAudio.pause();previewAudio.onended=null;previewAudio=null;}
  clearInterval(window._previewInterval);
  waveEl.querySelectorAll('.rec-bar').forEach((bar,i)=>{
    bar.style.height=(previewBars[i]||8)+'px';
    bar.style.background='rgba(255,255,255,.4)';
  });
  previewAudio=new Audio(pendingBlobUrl);
  recState='preview_playing';btn.textContent='⏸';
  previewAudio.play().then(()=>{
    window._previewInterval=setInterval(()=>{
      if(!previewAudio||previewAudio.paused){clearInterval(window._previewInterval);return;}
      const dur=previewAudio.duration||1;
      const pct=previewAudio.currentTime/dur;
      const played=Math.floor(pct*40);
      waveEl.querySelectorAll('.rec-bar').forEach((bar,i)=>{
        bar.style.height=(previewBars[i]||8)+'px';
        bar.style.background=i<played?'rgba(255,255,255,.95)':'rgba(255,255,255,.4)';
      });
      const s=Math.floor(previewAudio.currentTime);
      document.getElementById('rec-timer').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    },50);
    previewAudio.onended=()=>{
      clearInterval(window._previewInterval);
      recState='preview_paused';btn.textContent='▶';
      waveEl.querySelectorAll('.rec-bar').forEach((bar,i)=>{
        bar.style.height=(previewBars[i]||8)+'px';
        bar.style.background='rgba(255,255,255,.4)';
      });
      document.getElementById('rec-timer').textContent='0:00';
    };
  }).catch(()=>{recState='preview_paused';btn.textContent='▶';});
}

function seekPreview(e){
  if(!previewAudio||!previewAudio.duration)return;
  if(recState!=='preview_playing'&&recState!=='preview_paused')return;
  const rect=e.currentTarget.getBoundingClientRect();
  previewAudio.currentTime=((e.clientX-rect.left)/rect.width)*previewAudio.duration;
}

function hideRecordingBar(){
  clearInterval(window._previewInterval);
  if(previewAudio){previewAudio.pause();previewAudio.onended=null;previewAudio=null;}
  clearInterval(recTimerInterval);clearInterval(recWaveInterval);
  document.getElementById('vocal-recording-bar').classList.remove('active');
  document.getElementById('vocal-recording-actions').classList.remove('active');
  document.getElementById('input-row').style.display='flex';
  document.getElementById('rec-timer').textContent='0:00';
  document.getElementById('rec-pause-btn').textContent='⏸';
  document.getElementById('vocal-btn').classList.remove('recording');
  recState='idle';
  window._previewBars=null;
  if(pendingBlobUrl){URL.revokeObjectURL(pendingBlobUrl);pendingBlobUrl=null;}
}

async function sendRecording(){
  clearInterval(window._previewInterval);
  if(previewAudio){previewAudio.pause();previewAudio.onended=null;previewAudio=null;}
  if(recState==='recording'&&mediaRecorder&&mediaRecorder.state!=='inactive'){
    clearInterval(recTimerInterval);clearInterval(recWaveInterval);
    await new Promise(resolve=>{
      const orig=mediaRecorder.onstop;
      mediaRecorder.onstop=(...args)=>{orig?.(...args);resolve();};
      mediaRecorder.stop();recordingStream?.getTracks().forEach(t=>t.stop());
    });
    await new Promise(r=>setTimeout(r,150));
  }
  hideRecordingBar();
  if(!pendingBlob||pendingBlob.size<500)return;
  const blob=pendingBlob;pendingBlob=null;
  const file=new File([blob],`vocal_${Date.now()}.${blob._ext}`,{type:blob._type});
  await uploadAndSend(file,true);
}

function cancelRecording(){
  clearInterval(window._previewInterval);
  if(mediaRecorder&&mediaRecorder.state!=='inactive'){
    mediaRecorder.onstop=()=>{};
    mediaRecorder.stop();recordingStream?.getTracks().forEach(t=>t.stop());
  }
  pendingBlob=null;hideRecordingBar();
}
