<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Groupe</title>
<script src="audio-player.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
body{display:flex;justify-content:center;background:#000;}
.shell{width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#1a0a0f 0%,#0d0010 40%,#0a0015 100%);position:relative;overflow:hidden;}

.topbar{position:relative;z-index:10;padding:14px 16px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.4);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
.back{cursor:pointer;font-size:20px;background:none;border:none;color:white;padding:4px 8px 4px 0;}
.group-avatar-top{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#e8547a,#c73b8a);display:flex;align-items:center;justify-content:center;font-size:16px;color:white;font-weight:700;flex-shrink:0;cursor:pointer;}
.topbar-info{flex:1;min-width:0;cursor:pointer;}
.topbar-info h2{margin:0;font-size:15px;font-weight:600;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-sub{font-size:11px;color:rgba(255,255,255,.5);}

.messages-area{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1;}
.messages-area::-webkit-scrollbar{width:2px;}

/* Bulles groupe — afficher le nom de l'expéditeur */
.bubble-wrapper{display:flex;flex-direction:column;}
.bubble-wrapper.me{align-items:flex-end;}
.bubble-wrapper.them{align-items:flex-start;}

.sender-row{display:flex;align-items:flex-end;gap:8px;max-width:82%;}
.sender-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0;margin-bottom:4px;}
.sender-avatar-placeholder{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white;flex-shrink:0;margin-bottom:4px;}

.bubble{max-width:100%;padding:10px 14px;border-radius:22px;font-size:15px;line-height:1.45;word-break:break-word;cursor:pointer;user-select:none;}
.bubble.me{background:linear-gradient(135deg,#e8547a,#c73b8a);color:white;border-bottom-right-radius:6px;}
.bubble.them{background:rgba(255,255,255,.12);backdrop-filter:blur(10px);color:white;border-bottom-left-radius:6px;border:1px solid rgba(255,255,255,.08);}
.bubble.sticker-bubble{background:transparent !important;border:none !important;backdrop-filter:none !important;padding:4px !important;}

.sender-name{font-size:11px;font-weight:700;margin-bottom:3px;padding-left:2px;}
.forwarded-label{font-size:11px;opacity:.6;margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.bubble-time{font-size:10px;margin-top:4px;opacity:.5;text-align:right;color:white;display:flex;align-items:center;justify-content:flex-end;gap:4px;}
.edited-tag{font-size:9px;font-style:italic;color:rgba(255,255,255,.6);}

.reactions-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.reaction-pill{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:3px 8px;font-size:13px;cursor:pointer;user-select:none;}
.reaction-pill.mine{background:rgba(232,84,122,.25);border-color:rgba(232,84,122,.5);}
.reaction-count{font-size:11px;color:rgba(255,255,255,.7);font-weight:600;}

.reply-preview{border-left:2px solid rgba(255,255,255,.5);padding:4px 8px;margin-bottom:6px;border-radius:4px;background:rgba(0,0,0,.2);font-size:11px;cursor:pointer;overflow:hidden;}
.reply-preview-name{font-weight:700;font-size:10px;margin-bottom:1px;opacity:.8;}
.reply-preview-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7;}

.vocal-player{display:flex;align-items:center;gap:10px;min-width:180px;max-width:240px;padding:2px 0;}
.vocal-play-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.25);color:white;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.vocal-waveform{flex:1;height:30px;display:flex;align-items:center;gap:2px;cursor:pointer;}
.vocal-bar{flex:1;border-radius:2px;background:rgba(255,255,255,.3);min-height:3px;}
.vocal-bar.played{background:rgba(255,255,255,.9);}
.vocal-bar.active{background:white;}
.vocal-duration{font-size:11px;opacity:.7;flex-shrink:0;min-width:30px;text-align:right;}

.media-card-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:50px;cursor:pointer;}
.media-card-btn.me{background:rgba(255,255,255,.25);}
.media-card-btn.them{background:rgba(255,255,255,.2);}
.media-card-play{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;}
.media-card-play svg{width:11px;height:11px;fill:white;margin-left:2px;}
.media-card-label{font-size:15px;font-weight:700;color:rgba(0,0,0,.6);}

.typing-bubble{display:flex;gap:4px;align-items:center;padding:8px 12px;background:rgba(255,255,255,.12);border-radius:20px;align-self:flex-start;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);animation:bonce .9s infinite;}
.dot:nth-child(2){animation-delay:.2s;} .dot:nth-child(3){animation-delay:.4s;}
@keyframes bonce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}

.reply-bar{display:none;padding:8px 14px;background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.08);flex-direction:row;align-items:center;gap:10px;flex-shrink:0;z-index:10;}
.reply-bar.active{display:flex;}
.reply-bar-content{flex:1;min-width:0;}
.reply-bar-name{font-size:11px;font-weight:700;color:#e8547a;}
.reply-bar-text{font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reply-bar-cancel{background:none;border:none;color:rgba(255,255,255,.4);font-size:20px;cursor:pointer;}

.input-row{padding:10px 12px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.5);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;z-index:10;}
.media-btn{background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;padding:6px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.media-btn svg{width:22px;height:22px;}
.input-wrap{flex:1;display:flex;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:0 14px;min-width:0;}
.msg-input{flex:1;background:none;border:none;outline:none;font-size:15px;color:white;padding:10px 0;}
.msg-input::placeholder{color:rgba(255,255,255,.35);}
.send-btn{background:none;border:none;color:#e8547a;cursor:pointer;padding:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.send-btn svg{width:24px;height:24px;}

.ctx-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:190;}
.ctx-emoji-bar{position:fixed;z-index:201;background:#2a2a2a;border-radius:40px;padding:8px 12px;display:flex;gap:4px;align-items:center;box-shadow:0 8px 32px rgba(0,0,0,.5);}
.ctx-emoji-btn{font-size:26px;cursor:pointer;padding:4px;border-radius:50%;background:none;border:none;}
.ctx-menu{position:fixed;z-index:201;background:#2a2a2a;border-radius:16px;overflow:hidden;min-width:200px;box-shadow:0 8px 32px rgba(0,0,0,.5);}
.ctx-menu-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border:none;background:none;font-size:15px;color:white;cursor:pointer;width:100%;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);}
.ctx-menu-item:last-child{border-bottom:none;}
.ctx-menu-item.danger{color:#ff4444;}
.ctx-menu-item svg{width:20px;height:20px;flex-shrink:0;opacity:.8;}

@keyframes highlight{0%{outline:3px solid rgba(232,84,122,.8);}100%{outline:none;}}
.bubble.highlighted{animation:highlight 1.5s ease;}

.upload-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:white;}
.upload-overlay.active{display:flex;}
.upload-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:#e8547a;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <button class="back" onclick="location.href='groups.html'">←</button>
    <div class="group-avatar-top" id="group-avatar-top" onclick="openGroupInfo()"></div>
    <div class="topbar-info" onclick="openGroupInfo()">
      <h2 id="group-name-top"></h2>
      <div class="topbar-sub" id="members-count"></div>
    </div>
  </div>

  <div class="messages-area" id="messages-area"></div>

  <div class="reply-bar" id="reply-bar">
    <div id="reply-bar-icon" style="color:#e8547a;font-size:18px;">↩</div>
    <div class="reply-bar-content">
      <div class="reply-bar-name" id="reply-bar-name"></div>
      <div class="reply-bar-text" id="reply-bar-text"></div>
    </div>
    <button class="reply-bar-cancel" onclick="cancelReply()">×</button>
  </div>

  <div class="input-row" id="input-row">
    <button class="media-btn" onclick="pickMedia()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <button class="media-btn" id="vocal-btn"
      onmousedown="startRecording()" onmouseup="onMicRelease()"
      ontouchstart="startRecording(event)" ontouchend="onMicRelease()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <div class="input-wrap">
      <input type="text" class="msg-input" id="msg-input" placeholder="Message..."
        onkeydown="onKey(event)" autocomplete="off"/>
    </div>
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <input type="file" id="file-media" accept="image/*,video/*" style="display:none" onchange="handleFile(this)"/>
</div>

<div class="upload-overlay" id="upload-overlay">
  <div class="upload-spinner"></div><span>Envoi en cours...</span>
</div>

<script>
const API    = "https://didactic-disco-q795wwrqxg45c697p-8000.app.github.dev";
const WS_URL = "wss://didactic-disco-q795wwrqxg45c697p-8000.app.github.dev/ws";
const QUICK_EMOJIS = ['❤️','😂','😮','😢','😡','👍'];

const me    = JSON.parse(localStorage.getItem('me'));
const group = JSON.parse(localStorage.getItem('currentGroup'));
if(!me||!group) window.location.href='groups.html';

document.getElementById('group-name-top').textContent = group.name;
document.getElementById('group-avatar-top').textContent = group.name[0].toUpperCase();

let messages=[], ws=null, members=[], replyingTo=null;

async function loadMembers(){
  const res = await fetch(`${API}/group/${group.id}/members`);
  members = await res.json();
  const accepted = members.filter(m=>m.status==='accepted');
  document.getElementById('members-count').textContent = `${accepted.length} membre${accepted.length>1?'s':''}`;
}

function getMemberInfo(userId){
  return members.find(m=>String(m.id)===String(userId));
}

function connectWS(){
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{
    ws.send(JSON.stringify({user_id:me.id}));
    ws.send(JSON.stringify({action:'group_get_history',group_id:group.id}));
  };
  ws.onmessage=e=>{
    const data=JSON.parse(e.data);
    if(data.action==='group_history'&&String(data.group_id)===String(group.id)){
      messages=(data.messages||[]).map(m=>({
        from:String(m.from),text:m.text||'',
        media_url:m.media_url||null,media_type:m.media_type||null,
        is_vocal:m.is_vocal||false,time:m.time,msg_id:m.msg_id,
        edited:m.edited===1||m.edited===true,
        created_at:m.created_at||null,
        is_forwarded:m.is_forwarded===1||m.is_forwarded===true,
        sender_nom:m.sender_nom,sender_prenom:m.sender_prenom,sender_photo:m.sender_photo,
        reply_to_id:m.reply_to_id||null,reply_to_text:m.reply_to_text||null,
        reply_to_type:m.reply_to_type||null,reply_to_from:m.reply_to_from||null,
        reactions:m.reactions||[],
      }));
      renderMessages();
    }
    else if(data.action==='group_new_message'&&String(data.group_id)===String(group.id)){
      messages.push({
        from:String(data.from),text:data.text||'',
        media_url:data.media_url||null,media_type:data.media_type||null,
        is_vocal:data.is_vocal||false,time:data.time,msg_id:data.msg_id,
        edited:false,created_at:data.created_at||null,
        is_forwarded:data.is_forwarded||false,
        sender_nom:data.sender_nom,sender_prenom:data.sender_prenom,sender_photo:data.sender_photo,
        reply_to_id:data.reply_to_id||null,reply_to_text:data.reply_to_text||null,
        reply_to_type:data.reply_to_type||null,reply_to_from:data.reply_to_from||null,
        reactions:[],
      });
      renderMessages();
    }
    else if(data.action==='group_message_deleted'&&String(data.group_id)===String(group.id)){
      messages=messages.filter(m=>m.msg_id!==data.msg_id);renderMessages();
    }
    else if(data.action==='message_edited'){
      const m=messages.find(m=>m.msg_id===data.msg_id);
      if(m){m.text=data.text;m.edited=true;renderMessages();}
    }
    else if(data.action==='message_reaction'){
      const m=messages.find(m=>m.msg_id===data.msg_id);
      if(m){
        m.reactions=m.reactions.filter(r=>r.user_id!==String(data.user_id));
        m.reactions.push({emoji:data.emoji,user_id:String(data.user_id)});
        renderMessages();
      }
    }
    else if(data.action==='reaction_removed'){
      const m=messages.find(m=>m.msg_id===data.msg_id);
      if(m){m.reactions=m.reactions.filter(r=>!(r.user_id===String(data.user_id)&&r.emoji===data.emoji));renderMessages();}
    }
    else if(data.action==='group_member_joined'){loadMembers();}
    else if(data.action==='group_removed'&&String(data.group_id)===String(group.id)){
      alert('Vous avez été retiré de ce groupe');
      window.location.href='groups.html';
    }
  };
  ws.onclose=()=>setTimeout(connectWS,3000);
}

// ── Couleurs membres ──
const MEMBER_COLORS=['#e8547a','#9b59b6','#3498db','#e67e22','#2ecc71','#e74c3c','#1abc9c'];
function memberColor(userId){
  return MEMBER_COLORS[Math.abs(parseInt(userId||0))%MEMBER_COLORS.length];
}

function renderMessages(){
  const area=document.getElementById('messages-area');
  area.innerHTML=messages.map((m,i)=>{
    const isMe=String(m.from)===String(me.id);
    const isSticker=m.media_type==='sticker';
    const replyHTML=m.reply_to_id?buildReplyPreview(m):'';
    const content=buildContent(m,isMe);
    const editedTag=m.edited?`<span class="edited-tag">· modifié</span>`:'';
    const fwdLabel=m.is_forwarded?`<div class="forwarded-label">➤ Transféré</div>`:'';
    const reactionsHTML=buildReactionsHTML(m,isMe);

    if(isMe){
      return `<div class="bubble-wrapper me">
        <div class="bubble me${isSticker?' sticker-bubble':''}" id="msg_${m.msg_id}"
          oncontextmenu="openMenu(event,${i})"
          ontouchstart="touchStart(event,${i})" ontouchend="touchEnd()">
          ${fwdLabel}${replyHTML}${content}
          ${!isSticker?`<div class="bubble-time">${m.time||''}${editedTag}</div>`:''}
        </div>
        ${reactionsHTML}
      </div>`;
    } else {
      const color=memberColor(m.from);
      const senderName=`${m.sender_prenom||''} ${m.sender_nom||''}`.trim();
      const avatarEl=m.sender_photo
        ?`<img class="sender-avatar" src="${m.sender_photo}"/>`
        :`<div class="sender-avatar-placeholder" style="background:${color};">${(m.sender_prenom||'?')[0].toUpperCase()}</div>`;
      return `<div class="bubble-wrapper them">
        <div class="sender-name" style="color:${color};">${senderName}</div>
        <div class="sender-row">
          ${avatarEl}
          <div>
            <div class="bubble them${isSticker?' sticker-bubble':''}" id="msg_${m.msg_id}"
              oncontextmenu="openMenu(event,${i})"
              ontouchstart="touchStart(event,${i})" ontouchend="touchEnd()">
              ${fwdLabel}${replyHTML}${content}
              ${!isSticker?`<div class="bubble-time">${m.time||''}${editedTag}</div>`:''}
            </div>
            ${reactionsHTML}
          </div>
        </div>
      </div>`;
    }
  }).join('');
  area.scrollTop=area.scrollHeight;

  document.querySelectorAll('.vocal-waveform').forEach(el=>{
    el.addEventListener('click',e=>{
      const uid=el.dataset.uid;
      const audio=document.getElementById('audio_'+uid);
      if(!audio||!audio.duration)return;
      const rect=el.getBoundingClientRect();
      audio.currentTime=((e.clientX-rect.left)/rect.width)*audio.duration;
    });
  });
}

function buildReactionsHTML(m,isMe){
  if(!m.reactions||!m.reactions.length)return '';
  const groups={};
  m.reactions.forEach(r=>{
    if(!groups[r.emoji])groups[r.emoji]={count:0,mine:false};
    groups[r.emoji].count++;
    if(r.user_id===String(me.id))groups[r.emoji].mine=true;
  });
  const pills=Object.entries(groups).map(([emoji,g])=>
    `<div class="reaction-pill${g.mine?' mine':''}" onclick="toggleReaction('${m.msg_id}','${emoji}')">
      <span>${emoji}</span>${g.count>1?`<span class="reaction-count">${g.count}</span>`:''}
    </div>`
  ).join('');
  return `<div class="reactions-row" style="${isMe?'justify-content:flex-end;':'justify-content:flex-start;'}">${pills}</div>`;
}

function buildContent(m,isMe){
  if(m.media_type==='sticker'){
    return `<img src="${m.media_url}" alt="sticker" style="width:130px;height:130px;object-fit:contain;display:block;" loading="lazy"/>`;
  }
  if(m.media_type==='image'){
    const mJson=encodeURIComponent(JSON.stringify(m));
    return `<div class="media-card-btn ${isMe?'me':'them'}" onclick="openViewerEncoded('${mJson}')">
      <div class="media-card-play"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
      <span class="media-card-label">Photo</span></div>`;
  }
  if(m.media_type==='video'){
    const mJson=encodeURIComponent(JSON.stringify(m));
    return `<div class="media-card-btn ${isMe?'me':'them'}" onclick="openViewerEncoded('${mJson}')">
      <div class="media-card-play"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
      <span class="media-card-label">Vidéo</span></div>`;
  }
  if(m.media_type==='audio'){
    const uid=m.msg_id||Date.now();
    const uidStr=uid.toString();
    const bars=Array.from({length:24},(_,i)=>{
      const h=15+((uidStr.charCodeAt(i%uidStr.length)||50)*7+i*13)%60;
      return `<div class="vocal-bar" style="height:${h}%;"></div>`;
    }).join('');
    return `<div class="vocal-player">
      <button class="vocal-play-btn" onclick="toggleVocal('${uid}','${m.media_url}','${(m.sender_prenom||me.prenom)+' '+((m.sender_nom||me.nom)||'')}')">▶</button>
      <audio id="audio_${uid}" src="${m.media_url}" preload="auto"
        ontimeupdate="updateVocalBar('${uid}')" onended="resetVocal('${uid}')"></audio>
      <div class="vocal-waveform" data-uid="${uid}">${bars}</div>
      <span class="vocal-duration" id="dur_${uid}">0:00</span>
    </div>`;
  }
  return `<span>${m.text}</span>`;
}

function toggleVocal(uid, url, senderName){
  const audio=document.getElementById('audio_'+uid);
  const btn=audio?.previousElementSibling;
  if(!audio)return;
  if(audio.paused){
    document.querySelectorAll('audio').forEach(a=>{if(a!==audio){a.pause();}});
    audio.play().then(()=>{
      if(btn)btn.textContent='⏸';
      // Lancer le mini player global
      if(window.GlobalAudioPlayer){
        window.GlobalAudioPlayer.play(url, senderName, null, audio.currentTime);
      }
    }).catch(()=>{});
  } else {
    audio.pause();if(btn)btn.textContent='▶';
  }
}
function updateVocalBar(uid){
  const audio=document.getElementById('audio_'+uid);
  if(!audio||!audio.duration)return;
  const pct=audio.currentTime/audio.duration;
  const played=Math.floor(pct*24);
  const waveEl=document.querySelector(`.vocal-waveform[data-uid="${uid}"]`);
  if(waveEl)waveEl.querySelectorAll('.vocal-bar').forEach((bar,i)=>{
    bar.className='vocal-bar'+(i<played?' played':i===played?' active':'');
  });
  const dur=document.getElementById('dur_'+uid);
  if(dur){const s=Math.floor(audio.currentTime);dur.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
}
function resetVocal(uid){
  const audio=document.getElementById('audio_'+uid);if(audio)audio.currentTime=0;
  const btn=audio?.previousElementSibling;if(btn)btn.textContent='▶';
  const waveEl=document.querySelector(`.vocal-waveform[data-uid="${uid}"]`);
  if(waveEl)waveEl.querySelectorAll('.vocal-bar').forEach(b=>b.className='vocal-bar');
  const dur=document.getElementById('dur_'+uid);if(dur)dur.textContent='0:00';
}

function openViewer(m){
  localStorage.setItem('viewerMedia',JSON.stringify({url:m.media_url,type:m.media_type,from:String(m.from)===String(me.id)?'Toi':(m.sender_prenom||''),time:m.time}));
  window.location.href='viewer.html';
}
function openViewerEncoded(encoded){openViewer(JSON.parse(decodeURIComponent(encoded)));}

function buildReplyPreview(m){
  const fromName=m.reply_to_from===String(me.id)?'Toi':(m.sender_prenom||'');
  let txt=m.reply_to_text||'';
  if(!txt){if(m.reply_to_type==='image')txt='📷 Photo';else if(m.reply_to_type==='video')txt='🎥 Vidéo';else if(m.reply_to_type==='audio')txt='🎵 Vocal';}
  return `<div class="reply-preview" onclick="scrollToMessage('${m.reply_to_id}',event)">
    <div class="reply-preview-name">${fromName}</div>
    <div class="reply-preview-text">${txt}</div></div>`;
}

function scrollToMessage(msgId,event){
  event.stopPropagation();
  const el=document.getElementById('msg_'+msgId);if(!el)return;
  const area=document.getElementById('messages-area');
  area.scrollTo({top:el.offsetTop-area.clientHeight/2+el.clientHeight/2,behavior:'smooth'});
  el.classList.add('highlighted');setTimeout(()=>el.classList.remove('highlighted'),1500);
}

function cancelReply(){
  replyingTo=null;
  document.getElementById('reply-bar').classList.remove('active');
}

function toggleReaction(msgId,emoji){
  ws?.send(JSON.stringify({action:'react_message',group_id:group.id,msg_id:msgId,emoji}));
}

let touchTimer=null;
function touchStart(event,idx){touchTimer=setTimeout(()=>openMenu(null,idx),500);}
function touchEnd(){clearTimeout(touchTimer);}

function closeMenu(){
  document.getElementById('ctx-overlay')?.remove();
  document.getElementById('ctx-emoji-bar')?.remove();
  document.getElementById('ctx-menu')?.remove();
}

function openMenu(event,idx){
  if(event)event.preventDefault();
  const m=messages[idx];if(!m)return;
  const isMe=String(m.from)===String(me.id);
  closeMenu();

  const overlay=document.createElement('div');
  overlay.className='ctx-overlay';overlay.id='ctx-overlay';overlay.onclick=closeMenu;
  document.body.appendChild(overlay);

  const emojiBar=document.createElement('div');
  emojiBar.className='ctx-emoji-bar';emojiBar.id='ctx-emoji-bar';
  ['❤️','😂','😮','😢','😡','👍'].forEach(emoji=>{
    const btn=document.createElement('button');
    btn.className='ctx-emoji-btn';btn.textContent=emoji;
    btn.onclick=()=>{closeMenu();toggleReaction(m.msg_id,emoji);};
    emojiBar.appendChild(btn);
  });
  document.body.appendChild(emojiBar);

  const menu=document.createElement('div');
  menu.className='ctx-menu';menu.id='ctx-menu';

  // Répondre
  const replyBtn=document.createElement('button');
  replyBtn.className='ctx-menu-item';
  replyBtn.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg><span>Répondre</span>`;
  replyBtn.onclick=()=>{
    closeMenu();
    replyingTo={msg_id:m.msg_id,from:m.from,text:m.text,media_type:m.media_type};
    const fromName=isMe?'Toi':(m.sender_prenom||'');
    document.getElementById('reply-bar-name').textContent=fromName;
    document.getElementById('reply-bar-text').textContent=m.text||'📎 Média';
    document.getElementById('reply-bar').classList.add('active');
    document.getElementById('msg-input').focus();
  };
  menu.appendChild(replyBtn);

  if(isMe){
    const delBtn=document.createElement('button');
    delBtn.className='ctx-menu-item danger';
    delBtn.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg><span>Supprimer</span>`;
    delBtn.onclick=()=>{closeMenu();deleteGroupMessage(m.msg_id);};
    menu.appendChild(delBtn);
  }

  const cancelBtn=document.createElement('button');
  cancelBtn.className='ctx-menu-item';cancelBtn.innerHTML='<span style="color:rgba(255,255,255,.4)">Annuler</span>';
  cancelBtn.onclick=closeMenu;
  menu.appendChild(cancelBtn);
  document.body.appendChild(menu);

  // Positionner
  requestAnimationFrame(()=>{
    const bubbleEl=document.getElementById('msg_'+m.msg_id);
    const rect=bubbleEl?bubbleEl.getBoundingClientRect():{top:200};
    const emojiH=emojiBar.offsetHeight||60;
    const menuH=menu.offsetHeight||180;
    const totalH=emojiH+8+menuH;
    const windowH=window.innerHeight;
    let topPos=rect.top>totalH+20?rect.top-totalH-10:Math.min(rect.bottom+10,windowH-totalH-10);
    emojiBar.style.cssText+=`;top:${topPos}px;left:50%;transform:translateX(-50%);`;
    menu.style.cssText+=`;top:${topPos+emojiH+8}px;left:50%;transform:translateX(-50%);`;
  });
}

function deleteGroupMessage(msgId){
  ws?.send(JSON.stringify({action:'group_delete_message',group_id:group.id,msg_id:msgId}));
  messages=messages.filter(m=>m.msg_id!==msgId);renderMessages();
}

function sendMessage(){
  const input=document.getElementById('msg-input');
  const text=input.value.trim();if(!text)return;
  const now=new Date(),time=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  const msgId=`g${group.id}_${me.id}_${Date.now()}`;
  messages.push({
    from:String(me.id),text,media_url:null,media_type:null,
    is_vocal:false,edited:false,time,msg_id:msgId,
    created_at:new Date().toISOString(),is_forwarded:false,
    sender_nom:me.nom,sender_prenom:me.prenom,sender_photo:me.photo,
    reply_to_id:replyingTo?.msg_id||null,reply_to_text:replyingTo?.text||null,
    reply_to_type:replyingTo?.media_type||null,reply_to_from:replyingTo?.from||null,
    reactions:[],
  });
  renderMessages();input.value='';
  ws?.send(JSON.stringify({
    action:'group_send_message',group_id:group.id,text,
    reply_to_id:replyingTo?.msg_id||null,reply_to_text:replyingTo?.text||null,
    reply_to_type:replyingTo?.media_type||null,reply_to_from:replyingTo?.from||null,
  }));
  cancelReply();
}

async function uploadAndSend(file,isVocal=false){
  document.getElementById('upload-overlay').classList.add('active');
  try{
    const fd=new FormData();fd.append('file',file);
    const res=await fetch(`${API}/upload`,{method:'POST',body:fd});
    const data=await res.json();
    if(!data.url)return;
    const now=new Date(),time=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
    const msgId=`g${group.id}_${me.id}_${Date.now()}`;
    messages.push({
      from:String(me.id),text:'',media_url:data.url,media_type:data.media_type,
      is_vocal:isVocal,edited:false,time,msg_id:msgId,
      created_at:new Date().toISOString(),is_forwarded:false,
      sender_nom:me.nom,sender_prenom:me.prenom,sender_photo:me.photo,
      reply_to_id:replyingTo?.msg_id||null,reply_to_text:replyingTo?.text||null,
      reply_to_type:replyingTo?.media_type||null,reply_to_from:replyingTo?.from||null,
      reactions:[],
    });
    renderMessages();
    ws?.send(JSON.stringify({
      action:'group_send_message',group_id:group.id,text:'',
      media_url:data.url,media_type:data.media_type,is_vocal:isVocal,
      reply_to_id:replyingTo?.msg_id||null,reply_to_text:replyingTo?.text||null,
      reply_to_type:replyingTo?.media_type||null,reply_to_from:replyingTo?.from||null,
    }));
    cancelReply();
  }catch(e){alert('Erreur réseau.');}
  finally{document.getElementById('upload-overlay').classList.remove('active');}
}

function pickMedia(){document.getElementById('file-media').click();}
function handleFile(input){if(input.files[0]){uploadAndSend(input.files[0]);input.value='';}}

function openGroupInfo(){
  window.location.href='group-info.html';
}

// Enregistrement vocal simplifié
let mediaRecorder=null,audioChunks=[],recordingStream=null;
async function startRecording(e){
  if(e)e.preventDefault();
  if(mediaRecorder&&mediaRecorder.state!=='inactive')return;
  try{
    recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mimeType=MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'audio/webm';
    mediaRecorder=new MediaRecorder(recordingStream,{mimeType});
    audioChunks=[];
    mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.onstop=async()=>{
      recordingStream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(audioChunks,{type:mimeType});
      const ext=mimeType.includes('mp4')?'mp4':'webm';
      const file=new File([blob],`vocal_${Date.now()}.${ext}`,{type:mimeType});
      await uploadAndSend(file,true);
    };
    mediaRecorder.start(100);
    document.getElementById('vocal-btn').style.color='#e8547a';
  }catch(e){alert('Microphone refusé.');}
}
function onMicRelease(){
  if(mediaRecorder&&mediaRecorder.state==='recording'){
    mediaRecorder.stop();
    document.getElementById('vocal-btn').style.color='';
  }
}

function onKey(e){if(e.key==='Enter')sendMessage();}

loadMembers();
connectWS();
</script>
