<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Suivi GPS en direct</title>
</head>
<body>

<h2>Localisation en direct</h2>

<p>Latitude : <span id="lat"></span></p>
<p>Longitude : <span id="lon"></span></p>
<p>Précision : <span id="acc"></span> mètres</p>

<script>
if ("geolocation" in navigator) {

  navigator.geolocation.watchPosition(
    function(position) {
      document.getElementById("lat").textContent = position.coords.latitude;
      document.getElementById("lon").textContent = position.coords.longitude;
      document.getElementById("acc").textContent = position.coords.accuracy;
    },
    function(error) {
      console.log("Erreur GPS :", error.message);
    },
    {
      enableHighAccuracy: true, // GPS précis
      maximumAge: 0,            // pas de cache
      timeout: 5000
    }
  );

} else {
  alert("La géolocalisation n'est pas supportée par ce navigateur.");
}
</script>

</body>
</html>
