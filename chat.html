<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#1e90ff"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ChatApp"/>
<link rel="apple-touch-icon" href="icon.png"/>
<title>Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;font-family:Arial,sans-serif;background:#f0f2f5;}
body{display:flex;justify-content:center;}
.shell{width:100%;max-width:480px;background:white;height:100vh;display:flex;flex-direction:column;}

.topbar{background:#1e90ff;color:white;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.back{cursor:pointer;font-size:22px;background:none;border:none;color:white;padding:4px 8px 4px 0;}
.topbar-info{flex:1;min-width:0;}
.topbar-info h2{margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-sub{font-size:11px;opacity:.8;}

.messages-area{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:#f0f2f5;}

.bubble-wrapper{display:flex;flex-direction:column;}
.bubble-wrapper.me{align-items:flex-end;}
.bubble-wrapper.them{align-items:flex-start;}

.bubble{max-width:78%;padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.5;word-break:break-word;cursor:pointer;user-select:none;}
.bubble.me{background:#1e90ff;color:white;border-bottom-right-radius:4px;}
.bubble.them{background:white;color:#111;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08);}
.bubble-time{font-size:11px;margin-top:3px;opacity:.7;text-align:right;}
.seen-label{text-align:right;font-size:11px;color:#999;margin-top:-2px;margin-bottom:4px;padding-right:4px;}

.reply-preview{border-left:3px solid rgba(255,255,255,.6);padding:5px 8px;margin-bottom:6px;border-radius:6px;background:rgba(0,0,0,.08);font-size:12px;cursor:pointer;overflow:hidden;}
.bubble.them .reply-preview{border-left-color:#1e90ff;background:#f0f4ff;color:#555;}
.reply-preview-name{font-weight:700;font-size:11px;margin-bottom:2px;}
.reply-preview-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85;}

.reply-bar{display:none;padding:8px 14px;background:#f8f9ff;border-top:1px solid #e8e8e8;flex-direction:row;align-items:center;gap:10px;flex-shrink:0;}
.reply-bar.active{display:flex;}
.reply-bar-content{flex:1;min-width:0;}
.reply-bar-name{font-size:12px;font-weight:700;color:#1e90ff;}
.reply-bar-text{font-size:12px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reply-bar-cancel{background:none;border:none;color:#aaa;font-size:20px;cursor:pointer;flex-shrink:0;}

@keyframes highlight{0%{background:rgba(30,144,255,.25);}100%{background:transparent;}}
.bubble.highlighted{animation:highlight 1.5s ease;}

.typing-bubble{display:flex;gap:4px;align-items:center;padding:10px 14px;background:white;border-radius:18px;border-bottom-left-radius:4px;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.08);}
.dot{width:7px;height:7px;border-radius:50%;background:#aaa;animation:bonce .9s infinite;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes bonce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-6px);}}

.input-row{padding:10px 12px;border-top:1px solid #eee;display:flex;align-items:center;gap:6px;background:white;flex-shrink:0;}
.media-btn{background:none;border:none;color:#aaa;cursor:pointer;padding:6px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;}
.media-btn:hover{background:#f0f0f0;color:#1e90ff;}
.media-btn svg{width:22px;height:22px;}
.media-btn.recording{background:#e74c3c;color:white;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
.msg-input{flex:1;padding:10px 14px;border:1.5px solid #e8e8e8;border-radius:22px;font-size:15px;outline:none;background:#f8f8f8;min-width:0;}
.msg-input:focus{border-color:#1e90ff;background:white;}
.send-btn{background:#1e90ff;border:none;color:white;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.send-btn svg{width:18px;height:18px;}
.send-btn:hover{background:#0077e6;}
.send-btn:disabled{background:#aaa;cursor:not-allowed;}

.recording-hint{display:none;text-align:center;font-size:12px;color:#e74c3c;padding:6px;background:white;flex-shrink:0;border-top:1px solid #f0f0f0;}
.recording-hint.active{display:flex;align-items:center;justify-content:center;gap:8px;}
.rec-timer{font-weight:700;}

.upload-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:white;font-size:16px;}
.upload-overlay.active{display:flex;}
.upload-spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px;}
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <button class="back" onclick="location.href='friends.html'">←</button>
    <div id="friend-avatar-top" style="flex-shrink:0;"></div>
    <div class="topbar-info">
      <h2 id="chat-name"></h2>
      <div class="topbar-sub" id="chat-typing" style="display:none;">en train d'écrire...</div>
    </div>
  </div>

  <div class="messages-area" id="messages-area"></div>

  <div class="reply-bar" id="reply-bar">
    <div style="color:#1e90ff;font-size:20px;">↩</div>
    <div class="reply-bar-content">
      <div class="reply-bar-name" id="reply-bar-name"></div>
      <div class="reply-bar-text" id="reply-bar-text"></div>
    </div>
    <button class="reply-bar-cancel" onclick="cancelReply()">×</button>
  </div>

  <div class="recording-hint" id="recording-hint">
    🔴 <span>Enregistrement...</span>
    <span class="rec-timer" id="rec-timer">0:00</span>
    <span style="color:#999;font-size:11px;">Relâche pour envoyer</span>
  </div>

  <div class="input-row">
    <button class="media-btn" onclick="pickMedia()" title="Image ou vidéo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </button>
    <button class="media-btn" onclick="pickAudio()" title="Fichier audio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>
    </button>
    <button class="media-btn" id="vocal-btn"
      onmousedown="startRecording()"
      onmouseup="stopRecording()"
      ontouchstart="startRecording(event)"
      ontouchend="stopRecording()"
      title="Maintenir pour vocal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <input type="text" class="msg-input" id="msg-input"
      placeholder="Message..."
      onkeydown="onKey(event)"
      oninput="onTyping(this.value)"
      autocomplete="off"/>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <input type="file" id="file-media" accept="image/*,video/*" style="display:none" onchange="handleFile(this)"/>
  <input type="file" id="file-audio" accept="audio/*" style="display:none" onchange="handleFile(this)"/>
</div>

<div class="upload-overlay" id="upload-overlay">
  <div class="upload-spinner"></div>
  <span>Envoi en cours...</span>
</div>

<script>
const API    = "https://didactic-disco-q795wwrqxg45c697p-8000.app.github.dev";
const WS_URL = "wss://didactic-disco-q795wwrqxg45c697p-8000.app.github.dev/ws";

const me     = JSON.parse(localStorage.getItem('me'));
const friend = JSON.parse(localStorage.getItem('currentFriend'));
if (!me || !friend) window.location.href = 'friends.html';

document.getElementById('chat-name').textContent = `${friend.prenom} ${friend.nom}`;

// ── Avatar ami dans la topbar ──
const avatarTop = document.getElementById('friend-avatar-top');
if (friend.photo) {
  avatarTop.innerHTML = `<img src="${friend.photo}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.4);"/>`;
} else {
  const COLORS=['#1565c0','#b71c1c','#1b5e20','#4a148c','#e65100','#006064'];
  const color = COLORS[Math.abs(parseInt(friend.id||0)) % COLORS.length];
  const init  = ((friend.prenom||'?')[0]+(friend.nom||'?')[0]).toUpperCase();
  avatarTop.innerHTML = `<div style="width:38px;height:38px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:white;border:2px solid rgba(255,255,255,.4);">${init}</div>`;
}

let messages=[], ws=null, seen=false, typingTimer=null, isTypingSent=false, replyingTo=null;

// ════════════════════════════════════════════
// WEBSOCKET
// ════════════════════════════════════════════
function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    ws.send(JSON.stringify({ user_id: me.id }));
    ws.send(JSON.stringify({ action: 'get_history', to: friend.id }));
    ws.send(JSON.stringify({ action: 'mark_read',   to: friend.id }));
  };
  ws.onmessage = e => {
    const data = JSON.parse(e.data);

    if (data.action === 'history') {
      messages = (data.messages||[]).map(m => ({
        from:          String(m.from!==undefined?m.from:m.from_user),
        text:          m.text||'',
        media_url:     m.media_url||null,
        media_type:    m.media_type||null,
        is_vocal:      m.is_vocal||false,
        time:          m.time,
        msg_id:        m.msg_id,
        reply_to_id:   m.reply_to_id||null,
        reply_to_text: m.reply_to_text||null,
        reply_to_type: m.reply_to_type||null,
        reply_to_from: m.reply_to_from||null,
      }));
      renderMessages();
    }

    else if (data.action==='new_message' && String(data.from)===String(friend.id)) {
      messages.push({
        from:          String(data.from),
        text:          data.text||'',
        media_url:     data.media_url||null,
        media_type:    data.media_type||null,
        is_vocal:      data.is_vocal||false,
        time:          data.time,
        msg_id:        data.msg_id,
        reply_to_id:   data.reply_to_id||null,
        reply_to_text: data.reply_to_text||null,
        reply_to_type: data.reply_to_type||null,
        reply_to_from: data.reply_to_from||null,
      });
      renderMessages();
      ws.send(JSON.stringify({ action:'mark_read', to:friend.id }));
    }

    else if (data.action==='typing' && String(data.from)===String(friend.id)) {
      showTyping(data.is_typing);
    }

    else if (data.action==='seen') {
      seen=true; renderMessages();
    }

    else if (data.action==='message_deleted') {
      messages = messages.filter(m=>m.msg_id!==data.msg_id);
      renderMessages();
    }
  };
  ws.onclose = () => setTimeout(connectWS, 3000);
}

// ════════════════════════════════════════════
// OUVRIR LE VIEWER
// ════════════════════════════════════════════
function openViewer(m) {
  const fromName = String(m.from)===String(me.id) ? 'Toi' : friend.prenom;
  localStorage.setItem('viewerMedia', JSON.stringify({
    url:     m.media_url,
    type:    m.media_type,
    from:    fromName,
    time:    m.time,
    isVocal: m.is_vocal||false,
  }));
  window.location.href = 'viewer.html';
}

// ════════════════════════════════════════════
// MEDIA CARD — juste le type, pas d'aperçu
// ════════════════════════════════════════════
function buildMediaCard(m, isMe) {
  const type    = m.media_type;
  const isVocal = m.is_vocal || false;
  const color   = isMe ? 'rgba(255,255,255,.15)' : '#f0f4ff';
  const txtColor= isMe ? 'white' : '#1e90ff';

  // Sérialiser proprement pour l'onclick
  const mJson = encodeURIComponent(JSON.stringify(m));

  if (type === 'image') {
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;"
        onclick="openViewerEncoded('${mJson}')">
        <div style="width:42px;height:42px;border-radius:10px;background:${color};display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">🖼️</div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;color:${txtColor};">Photo</div>
          <div style="font-size:11px;opacity:.65;color:${txtColor};">Appuie pour voir</div>
        </div>
        <div style="font-size:18px;opacity:.5;color:${txtColor};">›</div>
      </div>`;
  }

  if (type === 'video') {
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;"
        onclick="openViewerEncoded('${mJson}')">
        <div style="width:42px;height:42px;border-radius:10px;background:${color};display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">🎥</div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;color:${txtColor};">Vidéo</div>
          <div style="font-size:11px;opacity:.65;color:${txtColor};">Appuie pour regarder</div>
        </div>
        <div style="font-size:18px;opacity:.5;color:${txtColor};">›</div>
      </div>`;
  }

  if (type === 'audio') {
    const label = isVocal ? 'Message vocal' : 'Audio';
    const emoji = isVocal ? '🎤' : '🎵';
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;"
        onclick="openViewerEncoded('${mJson}')">
        <div style="width:42px;height:42px;border-radius:10px;background:${color};display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">${emoji}</div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;color:${txtColor};">${label}</div>
          <div style="font-size:11px;opacity:.65;color:${txtColor};">Appuie pour écouter</div>
        </div>
        <div style="font-size:18px;opacity:.5;color:${txtColor};">›</div>
      </div>`;
  }

  return `<a href="${m.media_url}" target="_blank" style="color:${txtColor};">📎 Fichier</a>`;
}

// Passer par encodeURIComponent pour éviter les problèmes de guillemets
function openViewerEncoded(encoded) {
  const m = JSON.parse(decodeURIComponent(encoded));
  openViewer(m);
}

// ════════════════════════════════════════════
// RENDER MESSAGES
// ════════════════════════════════════════════
function renderMessages() {
  const area = document.getElementById('messages-area');
  let lastMineIdx = -1;
  for (let i=messages.length-1; i>=0; i--) {
    if (String(messages[i].from)===String(me.id)) { lastMineIdx=i; break; }
  }

  area.innerHTML = messages.map((m, i) => {
    const isMe     = String(m.from)===String(me.id);
    const showSeen = isMe && i===lastMineIdx && seen;
    const replyHTML = m.reply_to_id ? buildReplyPreview(m) : '';
    const content   = m.media_url
      ? buildMediaCard(m, isMe)
      : `<span>${m.text}</span>`;

    return `
      <div class="bubble-wrapper ${isMe?'me':'them'}">
        <div class="bubble ${isMe?'me':'them'}"
          id="msg_${m.msg_id}"
          oncontextmenu="openMenu(event,${i})"
          ontouchstart="touchStart(event,${i})"
          ontouchend="touchEnd()">
          ${replyHTML}
          ${content}
          <div class="bubble-time">${m.time||''}</div>
        </div>
        ${showSeen?'<div class="seen-label">Seen</div>':''}
      </div>`;
  }).join('');

  area.scrollTop = area.scrollHeight;
}

function buildReplyPreview(m) {
  const fromName = m.reply_to_from===String(me.id) ? 'Toi' : friend.prenom;
  let txt = m.reply_to_text||'';
  if (!txt) {
    if (m.reply_to_type==='image') txt='📷 Photo';
    else if (m.reply_to_type==='video') txt='🎥 Vidéo';
    else if (m.reply_to_type==='audio') txt='🎵 Audio';
    else txt='📎 Fichier';
  }
  return `
    <div class="reply-preview" onclick="scrollToMessage('${m.reply_to_id}',event)">
      <div class="reply-preview-name">${fromName}</div>
      <div class="reply-preview-text">${txt}</div>
    </div>`;
}

function scrollToMessage(msgId, event) {
  event.stopPropagation();
  const el = document.getElementById('msg_'+msgId);
  if (!el) return;
  el.scrollIntoView({ behavior:'smooth', block:'center' });
  el.classList.add('highlighted');
  setTimeout(()=>el.classList.remove('highlighted'), 1500);
}

// ════════════════════════════════════════════
// MENU CONTEXTUEL
// ════════════════════════════════════════════
let touchTimer = null;
function touchStart(event, idx) { touchTimer=setTimeout(()=>openMenu(null,idx),500); }
function touchEnd() { clearTimeout(touchTimer); }

function openMenu(event, idx) {
  if (event) event.preventDefault();
  const m    = messages[idx];
  if (!m) return;
  const isMe = String(m.from)===String(me.id);
  const existing = document.getElementById('ctx-menu');
  if (existing) existing.remove();

  const menu = document.createElement('div');
  menu.id = 'ctx-menu';
  menu.style.cssText = `position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:white;border-radius:14px;box-shadow:0 4px 24px rgba(0,0,0,.18);
    display:flex;flex-direction:column;overflow:hidden;z-index:200;min-width:200px;`;

  const replyBtn = document.createElement('button');
  replyBtn.innerHTML = '↩&nbsp;&nbsp;Répondre';
  replyBtn.style.cssText = 'padding:14px 20px;border:none;background:none;font-size:15px;cursor:pointer;text-align:left;border-bottom:1px solid #f5f5f5;';
  replyBtn.onclick = () => {
    menu.remove();
    replyingTo = { msg_id:m.msg_id, from:m.from, text:m.text, media_type:m.media_type };
    const fromName = m.from===String(me.id)?'Toi':friend.prenom;
    let txt = m.text||'';
    if (!txt) {
      if (m.media_type==='image') txt='📷 Photo';
      else if (m.media_type==='video') txt='🎥 Vidéo';
      else if (m.media_type==='audio') txt='🎵 Audio';
    }
    document.getElementById('reply-bar-name').textContent = fromName;
    document.getElementById('reply-bar-text').textContent = txt;
    document.getElementById('reply-bar').classList.add('active');
    document.getElementById('msg-input').focus();
  };
  menu.appendChild(replyBtn);

  if (isMe) {
    const deleteBtn = document.createElement('button');
    deleteBtn.innerHTML = '🗑&nbsp;&nbsp;Supprimer';
    deleteBtn.style.cssText = 'padding:14px 20px;border:none;background:none;font-size:15px;cursor:pointer;text-align:left;color:#e74c3c;border-bottom:1px solid #f5f5f5;';
    deleteBtn.onclick = () => { menu.remove(); deleteMessage(m.msg_id); };
    menu.appendChild(deleteBtn);
  }

  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = 'Annuler';
  cancelBtn.style.cssText = 'padding:14px 20px;border:none;background:#f8f8f8;font-size:15px;cursor:pointer;color:#999;';
  cancelBtn.onclick = () => menu.remove();
  menu.appendChild(cancelBtn);

  document.body.appendChild(menu);
  setTimeout(()=>{ document.addEventListener('click',()=>menu.remove(),{once:true}); },100);
}

function deleteMessage(msgId) {
  ws?.send(JSON.stringify({ action:'delete_message', to:friend.id, msg_id:msgId }));
  messages = messages.filter(m=>m.msg_id!==msgId);
  renderMessages();
}

function cancelReply() {
  replyingTo = null;
  document.getElementById('reply-bar').classList.remove('active');
}

// ════════════════════════════════════════════
// ENVOYER UN MESSAGE TEXTE
// ════════════════════════════════════════════
function sendMessage() {
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text) return;
  const now=new Date(), time=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  const msgId=`${me.id}_${Date.now()}`;
  messages.push({
    from:String(me.id), text, media_url:null, media_type:null, is_vocal:false,
    time, msg_id:msgId,
    reply_to_id:replyingTo?.msg_id||null,
    reply_to_text:replyingTo?.text||null,
    reply_to_type:replyingTo?.media_type||null,
    reply_to_from:replyingTo?.from||null,
  });
  seen=false; renderMessages(); input.value='';
  ws?.send(JSON.stringify({
    action:'send_message', to:friend.id, text,
    reply_to_id:replyingTo?.msg_id||null,
    reply_to_text:replyingTo?.text||null,
    reply_to_type:replyingTo?.media_type||null,
    reply_to_from:replyingTo?.from||null,
  }));
  cancelReply(); clearTypingState();
}

// ════════════════════════════════════════════
// UPLOAD ET ENVOI D'UN FICHIER
// ════════════════════════════════════════════
async function uploadAndSend(file, isVocal=false) {
  document.getElementById('upload-overlay').classList.add('active');
  document.getElementById('send-btn').disabled = true;
  try {
    const fd = new FormData();
    fd.append('file', file);
    const res  = await fetch(`${API}/upload`, { method:'POST', body:fd });
    const data = await res.json();
    if (!data.url) { alert('Erreur upload.'); return; }
    const now=new Date(), time=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
    const msgId=`${me.id}_${Date.now()}`;
    messages.push({
      from:String(me.id), text:'',
      media_url:data.url, media_type:data.media_type, is_vocal:isVocal,
      time, msg_id:msgId,
      reply_to_id:replyingTo?.msg_id||null,
      reply_to_text:replyingTo?.text||null,
      reply_to_type:replyingTo?.media_type||null,
      reply_to_from:replyingTo?.from||null,
    });
    seen=false; renderMessages();
    ws?.send(JSON.stringify({
      action:'send_message', to:friend.id, text:'',
      media_url:data.url, media_type:data.media_type, is_vocal:isVocal,
      reply_to_id:replyingTo?.msg_id||null,
      reply_to_text:replyingTo?.text||null,
      reply_to_type:replyingTo?.media_type||null,
      reply_to_from:replyingTo?.from||null,
    }));
    cancelReply();
  } catch(e) { alert('Erreur réseau.'); }
  finally {
    document.getElementById('upload-overlay').classList.remove('active');
    document.getElementById('send-btn').disabled = false;
  }
}

function pickMedia() { document.getElementById('file-media').click(); }
function pickAudio() { document.getElementById('file-audio').click(); }
function handleFile(input) {
  if (input.files[0]) { uploadAndSend(input.files[0]); input.value=''; }
}

// ════════════════════════════════════════════
// ENREGISTREMENT VOCAL
// ════════════════════════════════════════════
let mediaRecorder=null, audioChunks=[], recordingStream=null, recTimerInterval=null, recSeconds=0;

async function startRecording(e) {
  if (e) e.preventDefault();
  try {
    recordingStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    mediaRecorder   = new MediaRecorder(recordingStream);
    audioChunks=[]; recSeconds=0;
    mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      recordingStream.getTracks().forEach(t=>t.stop());
      clearInterval(recTimerInterval);
      document.getElementById('vocal-btn').classList.remove('recording');
      document.getElementById('recording-hint').classList.remove('active');
      document.getElementById('rec-timer').textContent='0:00';
      const blob = new Blob(audioChunks,{type:'audio/webm'});
      if (blob.size<500) return;
      const file = new File([blob],`vocal_${Date.now()}.webm`,{type:'audio/webm'});
      await uploadAndSend(file, true);
    };
    mediaRecorder.start();
    recTimerInterval = setInterval(()=>{
      recSeconds++;
      const m=Math.floor(recSeconds/60), s=recSeconds%60;
      document.getElementById('rec-timer').textContent=`${m}:${String(s).padStart(2,'0')}`;
    },1000);
    document.getElementById('vocal-btn').classList.add('recording');
    document.getElementById('recording-hint').classList.add('active');
  } catch(e) { alert('Accès au microphone refusé.'); }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop();
}

// ════════════════════════════════════════════
// TYPING
// ════════════════════════════════════════════
function onTyping(text) {
  if (!text) {
    ws?.send(JSON.stringify({action:'typing',to:friend.id,is_typing:false}));
    isTypingSent=false; clearTimeout(typingTimer); return;
  }
  if (!isTypingSent) {
    ws?.send(JSON.stringify({action:'typing',to:friend.id,is_typing:true}));
    isTypingSent=true;
  }
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>{
    ws?.send(JSON.stringify({action:'typing',to:friend.id,is_typing:false}));
    isTypingSent=false;
  },2000);
}
function clearTypingState() {
  clearTimeout(typingTimer);
  ws?.send(JSON.stringify({action:'typing',to:friend.id,is_typing:false}));
  isTypingSent=false;
}
function showTyping(isTyping) {
  document.getElementById('chat-typing').style.display=isTyping?'block':'none';
  const area=document.getElementById('messages-area');
  let tb=document.getElementById('typing-bubble');
  if (isTyping&&!tb) {
    tb=document.createElement('div'); tb.id='typing-bubble'; tb.className='typing-bubble';
    tb.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    area.appendChild(tb); area.scrollTop=area.scrollHeight;
  } else if (!isTyping&&tb) { tb.remove(); }
}

function onKey(e) { if(e.key==='Enter') sendMessage(); }

connectWS();
