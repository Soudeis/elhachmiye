<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
   <script src="audio-player.js"></script>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#1e90ff"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ChatApp"/>
<link rel="apple-touch-icon" href="icon.png"/>
   <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<title>Demandes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;font-family:Arial,sans-serif;background:#f0f2f5;}
body{display:flex;justify-content:center;}
.shell{width:100%;max-width:480px;background:white;min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:#1e90ff;color:white;padding:14px 16px;display:flex;align-items:center;gap:10px;}
.back{cursor:pointer;font-size:22px;background:none;border:none;color:white;padding:4px 8px 4px 0;}
.topbar h2{font-size:16px;margin:0;}
.list-area{flex:1;overflow-y:auto;}
.req-item{display:flex;align-items:center;padding:12px 16px;gap:12px;border-bottom:1px solid #f5f5f5;}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:white;flex-shrink:0;}
.friend-info{flex:1;}
.friend-name{font-size:15px;font-weight:600;color:#111;}
.friend-sub{font-size:13px;color:#999;margin-top:2px;}
.req-actions{display:flex;gap:8px;flex-shrink:0;}
.accept-btn{background:#1e90ff;color:white;border:none;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;}
.reject-btn{background:#f0f0f0;color:#666;border:none;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ccc;gap:12px;font-size:14px;padding:40px;}
.empty-state svg{width:52px;height:52px;opacity:.35;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <button class="back" onclick="location.href='friends.html'">←</button>
    <h2>Demandes d'amis</h2>
  </div>
  <div class="list-area" id="requests-list"></div>
</div>

<script>
const API    = "https://didactic-disco-q795wwrqxg45c697p-8000.app.github.dev";
const WS_URL = "wss://didactic-disco-q795wwrqxg45c697p-8000.app.github.dev/ws";

const me = JSON.parse(localStorage.getItem('me'));
if (!me) window.location.href = 'index.html';

let requests = [];
let ws = null;

const COLORS = ['#1e90ff','#e74c3c','#2ecc71','#9b59b6','#f39c12','#16a085','#e67e22','#c0392b'];
const avatarColor = id => COLORS[Math.abs(parseInt(id||0)) % COLORS.length];
const initials = f => ((f.prenom||'?')[0]+(f.nom||'?')[0]).toUpperCase();

async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  try { return (await fetch(API+path, opts)).json(); }
  catch(e) { return {}; }
}

async function loadRequests() {
  const data = await api('GET', `/requests/${me.id}`);
  requests = Array.isArray(data) ? data.map(r => ({...r, id: String(r.id)})) : [];
  renderRequests();
}

function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => ws.send(JSON.stringify({ user_id: me.id }));
  ws.onmessage = e => {
    const data = JSON.parse(e.data);
    if (data.action === 'friend_request') {
      requests.push({ id: String(data.from), nom: data.nom, prenom: data.prenom });
      renderRequests();
    }
  };
  ws.onclose = () => setTimeout(connectWS, 3000);
}

function renderRequests() {
  const list = document.getElementById('requests-list');
  if (!requests.length) {
    list.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span>Aucune demande en attente</span></div>`;
    return;
  }
  list.innerHTML = requests.map(r => `
    <div class="req-item">
      <div class="avatar" style="background:${avatarColor(r.id)}">${initials(r)}</div>
      <div class="friend-info">
        <div class="friend-name">${r.prenom} ${r.nom}</div>
        <div class="friend-sub">Veut être ton ami</div>
      </div>
      <div class="req-actions">
        <button class="accept-btn" onclick="respond('${r.id}',true)">Accepter</button>
        <button class="reject-btn" onclick="respond('${r.id}',false)">Refuser</button>
      </div>
    </div>
  `).join('');
}

function respond(id, accepted) {
  ws?.send(JSON.stringify({ action: 'friend_response', to: id, accepted }));
  requests = requests.filter(r => r.id !== id);
  renderRequests();
}

loadRequests();
connectWS();
</script>
</body>
</html>
