<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Profil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
body{display:flex;justify-content:center;background:#000;}
.shell{width:100%;max-width:480px;min-height:100vh;background:linear-gradient(180deg,#1a0a0f 0%,#0d0010 40%,#0a0015 100%);display:flex;flex-direction:column;position:relative;}

/* ── HERO PHOTO ── */
.hero{
  position:relative;width:100%;height:340px;
  display:flex;align-items:flex-end;
  overflow:hidden;flex-shrink:0;
}
.hero-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  filter:blur(20px) brightness(.4);
  transform:scale(1.1);
  z-index:0;
}
.hero-photo-wrap{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-60%);
  width:140px;height:140px;border-radius:50%;
  overflow:hidden;
  border:3px solid rgba(232,84,122,.7);
  box-shadow:0 0 40px rgba(232,84,122,.5),0 0 80px rgba(232,84,122,.2);
  cursor:pointer;z-index:2;
  transition:transform .2s;
}
.hero-photo-wrap:active{transform:translate(-50%,-60%) scale(.96);}
.hero-photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.hero-initials{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:52px;font-weight:700;color:white;
}
.hero-gradient{
  position:absolute;bottom:0;left:0;right:0;height:120px;
  background:linear-gradient(to top,#0d0010,transparent);
  z-index:1;
}
.hero-name{
  position:relative;z-index:2;
  width:100%;padding:16px 20px 20px;
  text-align:center;
}
.hero-name h1{font-size:24px;font-weight:700;color:white;}
.hero-name p{font-size:13px;color:rgba(255,255,255,.4);margin-top:4px;}

/* ── BACK ── */
.back-btn{
  position:absolute;top:16px;left:16px;z-index:10;
  background:rgba(0,0,0,.4);backdrop-filter:blur(10px);
  border:none;color:white;width:38px;height:38px;
  border-radius:50%;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* ── ACTIONS ── */
.actions{
  display:flex;gap:12px;padding:20px 20px 0;
  justify-content:center;
}
.action-btn{
  flex:1;max-width:140px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;padding:16px 10px;
  cursor:pointer;color:white;
  transition:.15s;
}
.action-btn:active{background:rgba(255,255,255,.12);}
.action-btn svg{width:22px;height:22px;stroke:#e8547a;}
.action-btn span{font-size:12px;font-weight:600;color:rgba(255,255,255,.7);}

/* ── INFO CARD ── */
.info-card{
  margin:20px 16px 0;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;overflow:hidden;
}
.info-row{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.info-row:last-child{border-bottom:none;}
.info-icon{
  width:38px;height:38px;border-radius:12px;
  background:rgba(232,84,122,.15);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.info-icon svg{width:18px;height:18px;stroke:#e8547a;}
.info-label{font-size:11px;color:rgba(255,255,255,.35);}
.info-value{font-size:15px;color:white;margin-top:2px;font-weight:500;}

/* ── PHOTO OVERLAY ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes zoomIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="shell">

  <button class="back-btn" onclick="location.href='friends.html'">←</button>

  <div class="hero">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-photo-wrap" id="hero-photo-wrap" onclick="openPhoto()"></div>
    <div class="hero-gradient"></div>
    <div class="hero-name">
      <h1 id="hero-name"></h1>
      <p id="hero-sub"></p>
    </div>
  </div>

  <div class="actions">
    <button class="action-btn" onclick="goToChat()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Message</span>
    </button>
  </div>

  <div class="info-card">
    <div class="info-row">
      <div class="info-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div>
        <div class="info-label">Nom complet</div>
        <div class="info-value" id="info-name"></div>
      </div>
    </div>
  </div>

</div>

<script>
const data = JSON.parse(localStorage.getItem('viewProfile')||'null');
if(!data) location.href='friends.html';

const COLORS=['#e8547a','#9b59b6','#3498db','#e67e22','#2ecc71'];
const color=COLORS[Math.abs(parseInt(data.id||0))%COLORS.length];
const init=((data.prenom||'?')[0]+(data.nom||'?')[0]).toUpperCase();
const fullName=`${data.prenom||''} ${data.nom||''}`.trim();

// Hero bg
const bg=document.getElementById('hero-bg');
if(data.photo){
  bg.style.backgroundImage=`url('${data.photo}')`;
} else {
  bg.style.background=`linear-gradient(135deg,${color}55,#0a0015)`;
}

// Photo
const wrap=document.getElementById('hero-photo-wrap');
if(data.photo){
  wrap.innerHTML=`<img src="${data.photo}"/>`;
} else {
  wrap.innerHTML=`<div class="hero-initials" style="background:${color};">${init}</div>`;
}

// Nom
document.getElementById('hero-name').textContent=fullName;
document.getElementById('info-name').textContent=fullName;

// Sous-titre
const sub=data.isGroup
  ?`${data.memberCount||0} membre${(data.memberCount||0)>1?'s':''}`
  :'';
document.getElementById('hero-sub').textContent=sub;

function openPhoto(){
  if(!data.photo) return;
  const overlay=document.createElement('div');
  overlay.style.cssText=`
    position:fixed;inset:0;z-index:2000;
    background:rgba(0,0,0,.95);
    display:flex;align-items:center;justify-content:center;
    animation:fadeIn .2s ease;
  `;
  overlay.innerHTML=`
    <button onclick="this.parentElement.remove()" style="
      position:absolute;top:20px;right:20px;
      background:rgba(255,255,255,.12);border:none;
      width:42px;height:42px;border-radius:50%;
      color:white;font-size:22px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      backdrop-filter:blur(10px);
    ">×</button>

    <div style="animation:zoomIn .25s ease;display:flex;align-items:center;justify-content:center;">
      <div style="
        width:290px;height:290px;border-radius:50%;overflow:hidden;
        border:3px solid rgba(232,84,122,.7);
        box-shadow:0 0 60px rgba(232,84,122,.5),0 0 120px rgba(232,84,122,.15);
      ">
        <img src="${data.photo}" style="width:100%;height:100%;object-fit:cover;display:block;"/>
      </div>
    </div>

    <div style="
      position:absolute;inset:0;z-index:-1;
      background-image:url('${data.photo}');
      background-size:cover;background-position:center;
      filter:blur(40px) brightness(.25);
      transform:scale(1.1);
    "></div>
  `;
  overlay.onclick=e=>{ if(e.target===overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

function goToChat(){
  if(data.isGroup){
    localStorage.setItem('currentGroup',JSON.stringify({id:data.id,name:data.prenom,photo:data.photo||null}));
    location.href='group-chat.html';
  } else {
    localStorage.setItem('currentFriend',JSON.stringify(data));
    location.href='chat.html';
  }
}
</script>
</body>
</html>
