<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
   <script src="audio-player.js"></script>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#1e90ff"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ChatApp"/>
<link rel="apple-touch-icon" href="icon.png"/>
<title>Viewer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;font-family:Arial,sans-serif;overflow:hidden;}
body{display:flex;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#6a0572,#c0392b);}
.shell{width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column;position:relative;}

.topbar{position:absolute;top:0;left:0;right:0;z-index:10;padding:14px 16px;display:flex;align-items:center;gap:10px;background:linear-gradient(to bottom,rgba(0,0,0,.5),transparent);}
.back{cursor:pointer;font-size:22px;background:none;border:none;color:white;padding:4px 8px 4px 0;}
.topbar-title{flex:1;color:white;font-size:16px;font-weight:600;}
.topbar-time{color:rgba(255,255,255,.7);font-size:13px;}

#image-viewer{display:none;flex:1;align-items:center;justify-content:center;background:#000;overflow:hidden;cursor:zoom-in;}
#image-viewer img{max-width:100%;max-height:100vh;object-fit:contain;transition:transform .3s ease;user-select:none;}

#video-viewer{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;background:#000;}
#video-viewer video{width:100%;max-height:80vh;object-fit:contain;}

#audio-viewer{
  display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1a1a2e 0%,#6a0572 40%,#c0392b 100%);
  position:relative;overflow:hidden;padding:20px;
}
.bg-circle{position:absolute;border-radius:50%;opacity:.1;}
.bg-circle-1{width:300px;height:300px;background:#fff;top:-80px;right:-80px;}
.bg-circle-2{width:200px;height:200px;background:#e74c3c;bottom:-60px;left:-60px;}
.bg-circle-3{width:150px;height:150px;background:#9b59b6;top:50%;left:50%;transform:translate(-50%,-50%);}

.audio-avatar{
  width:110px;height:110px;border-radius:50%;
  background:linear-gradient(135deg,#9b59b6,#c0392b);
  display:flex;align-items:center;justify-content:center;
  font-size:44px;margin-bottom:28px;position:relative;z-index:1;
  box-shadow:0 0 0 12px rgba(192,57,43,.2),0 0 0 24px rgba(192,57,43,.1);
}
.audio-avatar.playing{animation:avatarPulse 1.5s ease-in-out infinite;}
@keyframes avatarPulse{
  0%,100%{box-shadow:0 0 0 12px rgba(192,57,43,.2),0 0 0 24px rgba(192,57,43,.1);}
  50%{box-shadow:0 0 0 20px rgba(192,57,43,.3),0 0 0 40px rgba(192,57,43,.15);}
}
.audio-label{color:white;font-size:18px;font-weight:700;margin-bottom:6px;position:relative;z-index:1;text-align:center;}
.audio-from{color:rgba(255,255,255,.6);font-size:13px;margin-bottom:32px;position:relative;z-index:1;}
.audio-error{color:#ff6b6b;font-size:12px;margin-top:8px;position:relative;z-index:1;text-align:center;display:none;}

.waveform-container{width:90%;max-width:340px;height:80px;position:relative;z-index:1;margin-bottom:24px;display:flex;align-items:center;gap:3px;cursor:pointer;}
.waveform-bar{flex:1;border-radius:3px;background:rgba(255,255,255,.2);transition:background .1s;min-height:4px;}
.waveform-bar.played{background:rgba(255,255,255,.85);}
.waveform-bar.active{background:white;}

.audio-progress-bar{width:90%;max-width:340px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;position:relative;z-index:1;margin-bottom:12px;cursor:pointer;}
.audio-progress-fill{height:100%;background:white;border-radius:2px;width:0%;transition:width .1s linear;position:relative;}
.audio-progress-fill::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:white;}

.audio-timer{color:rgba(255,255,255,.8);font-size:14px;margin-bottom:32px;position:relative;z-index:1;letter-spacing:.5px;}
.audio-controls{display:flex;align-items:center;gap:24px;position:relative;z-index:1;}
.ctrl-btn{background:none;border:none;color:rgba(255,255,255,.7);cursor:pointer;font-size:28px;padding:8px;transition:.2s;}
.ctrl-btn:active{transform:scale(.9);}
.play-btn{width:70px;height:70px;border-radius:50%;border:none;cursor:pointer;background:white;color:#c0392b;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:.2s;}
.play-btn:active{transform:scale(.95);}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <button class="back" onclick="history.back()">←</button>
    <span class="topbar-title" id="topbar-title"></span>
    <span class="topbar-time" id="topbar-time"></span>
  </div>

  <div id="image-viewer"><img id="viewer-img" src="" alt=""/></div>

  <div id="video-viewer"><video id="viewer-video" controls playsinline></video></div>

  <div id="audio-viewer">
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>
    <div class="audio-avatar" id="audio-avatar">🎵</div>
    <div class="audio-label" id="audio-label">Audio</div>
    <div class="audio-from" id="audio-from"></div>
    <div class="audio-error" id="audio-error"></div>
    <div class="waveform-container" id="waveform" onclick="seekByWaveform(event)"></div>
    <div class="audio-progress-bar" id="audio-progress-bar" onclick="seekByBar(event)">
      <div class="audio-progress-fill" id="audio-progress-fill"></div>
    </div>
    <div class="audio-timer" id="audio-timer">0:00 / 0:00</div>
    <div class="audio-controls">
      <button class="ctrl-btn" onclick="skip(-10)">⏪</button>
      <button class="play-btn" id="play-btn" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" onclick="skip(10)">⏩</button>
    </div>
    <audio id="viewer-audio"></audio>
  </div>
</div>

<script>
const media = JSON.parse(localStorage.getItem('viewerMedia') || '{}');
const { url, type, from, time } = media;
if (!url) { history.back(); }
document.getElementById('topbar-time').textContent = time || '';

if (type === 'image') {
  document.getElementById('topbar-title').textContent = 'Photo';
  document.querySelector('body').style.background = '#000';
  const viewer = document.getElementById('image-viewer');
  viewer.style.display = 'flex';
  const img = document.getElementById('viewer-img');
  img.src = url;
  let zoomed = false;
  img.addEventListener('dblclick', () => {
    zoomed = !zoomed;
    img.style.transform = zoomed ? 'scale(2)' : 'scale(1)';
    viewer.style.cursor = zoomed ? 'zoom-out' : 'zoom-in';
  });
  let initialDistance = 0;
  viewer.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      initialDistance = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  });
  viewer.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      img.style.transform = `scale(${Math.min(5, Math.max(1, dist / initialDistance))})`;
    }
  }, { passive: false });
}

else if (type === 'video') {
  document.getElementById('topbar-title').textContent = 'Vidéo';
  document.querySelector('body').style.background = '#000';
  document.getElementById('video-viewer').style.display = 'flex';
  document.getElementById('viewer-video').src = url;
}

else if (type === 'audio') {
  const isVocal = media.isVocal || false;
  document.getElementById('topbar-title').textContent = isVocal ? 'Message vocal' : 'Audio';
  document.getElementById('audio-label').textContent  = isVocal ? '🎤 Vocal' : '🎵 Audio';
  document.getElementById('audio-from').textContent   = from ? `De ${from}` : '';
  document.getElementById('audio-avatar').textContent = isVocal ? '🎤' : '🎵';
  document.getElementById('audio-viewer').style.display = 'flex';

  const audio = document.getElementById('viewer-audio');

  // Fix CORS mobile
  audio.preload = "auto";
audio.src     = url;
audio.load();

  const BARS   = 40;
  const waveEl = document.getElementById('waveform');
  const heights = Array.from({length: BARS}, () => Math.random() * 60 + 20);
  heights.forEach((h, i) => {
    const bar = document.createElement('div');
    bar.className   = 'waveform-bar';
    bar.style.height = h + '%';
    waveEl.appendChild(bar);
  });

  function formatTime(s) {
    const m = Math.floor(s / 60);
    return `${m}:${String(Math.floor(s % 60)).padStart(2,'0')}`;
  }

  function updateUI() {
    const cur = audio.currentTime || 0;
    const dur = audio.duration   || 0;
    document.getElementById('audio-timer').textContent =
      `${formatTime(cur)} / ${formatTime(dur)}`;
    document.getElementById('audio-progress-fill').style.width =
      dur ? (cur / dur * 100) + '%' : '0%';
    if (dur) {
      const pct    = cur / dur;
      const played = Math.floor(pct * BARS);
      document.querySelectorAll('.waveform-bar').forEach((bar, i) => {
        bar.className = 'waveform-bar' +
          (i < played ? ' played' : i === played ? ' active' : '');
      });
    }
  }

  audio.addEventListener('loadedmetadata', updateUI);
  audio.addEventListener('timeupdate',     updateUI);
  audio.addEventListener('ended', () => {
    document.getElementById('play-btn').textContent = '▶';
    document.getElementById('audio-avatar').classList.remove('playing');
    audio.currentTime = 0;
    updateUI();
  });

  function showError(err) {
    const el = document.getElementById('audio-error');
    el.textContent = '⚠️ ' + (err.message || err.name || 'Erreur lecture');
    el.style.display = 'block';
  }

  window.togglePlay = function() {
    const btn = document.getElementById('play-btn');
    const av  = document.getElementById('audio-avatar');
    document.getElementById('audio-error').style.display = 'none';

    if (audio.paused) {
      audio.play()
        .then(() => { btn.textContent='⏸'; av.classList.add('playing'); })
        .catch(err => { showError(err); console.error(err); });
    } else {
      audio.pause();
      btn.textContent = '▶';
      av.classList.remove('playing');
    }
  };

  window.skip = function(sec) {
    if (!audio.duration) return;
    audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + sec));
  };

  function playIfPaused() {
    if (audio.paused && audio.duration) {
      audio.play()
        .then(() => {
          document.getElementById('play-btn').textContent = '⏸';
          document.getElementById('audio-avatar').classList.add('playing');
        }).catch(err => showError(err));
    }
  }

  window.seekByWaveform = function(e) {
    if (!audio.duration) return;
    const rect = waveEl.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    playIfPaused();
  };

  window.seekByBar = function(e) {
    if (!audio.duration) return;
    const rect = document.getElementById('audio-progress-bar').getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    playIfPaused();
  };
}
</script>
</body>
</html>
