<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#000000"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ChatApp"/>
<link rel="apple-touch-icon" href="icon.png"/>
<title>Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
body{display:flex;justify-content:center;background:#000;}

.shell{
  width:100%;max-width:480px;height:100vh;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#1a0a0f 0%,#0d0010 40%,#1a0005 70%,#0a0015 100%);
  position:relative;overflow:hidden;
}
.shell::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(180,50,80,.03) 2px,rgba(180,50,80,.03) 4px);
  pointer-events:none;z-index:0;
}
.shell::after{
  content:'';position:absolute;width:300px;height:300px;
  background:radial-gradient(circle,rgba(220,80,120,.15) 0%,transparent 70%);
  top:30%;left:50%;transform:translateX(-50%);
  pointer-events:none;z-index:0;
}

.topbar{
  position:relative;z-index:10;
  padding:14px 16px;display:flex;align-items:center;gap:10px;
  background:rgba(0,0,0,.4);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;
}
.back{cursor:pointer;font-size:20px;background:none;border:none;color:white;padding:4px 8px 4px 0;}
.topbar-info{flex:1;min-width:0;}
.topbar-info h2{margin:0;font-size:15px;font-weight:600;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-sub{font-size:11px;color:rgba(255,255,255,.5);}

.messages-area{
  flex:1;overflow-y:auto;padding:12px 14px;
  display:flex;flex-direction:column;gap:4px;
  background:transparent;position:relative;z-index:1;
}
.messages-area::-webkit-scrollbar{width:2px;}
.messages-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px;}

.bubble-wrapper{display:flex;flex-direction:column;}
.bubble-wrapper.me{align-items:flex-end;}
.bubble-wrapper.them{align-items:flex-start;}

.bubble{
  max-width:78%;padding:10px 14px;
  border-radius:22px;font-size:15px;line-height:1.45;
  word-break:break-word;cursor:pointer;user-select:none;
}
.bubble.me{background:linear-gradient(135deg,#e8547a,#c73b8a);color:white;border-bottom-right-radius:6px;}
.bubble.them{background:rgba(255,255,255,.12);backdrop-filter:blur(10px);color:white;border-bottom-left-radius:6px;border:1px solid rgba(255,255,255,.08);}
.bubble-time{font-size:10px;margin-top:4px;opacity:.5;text-align:right;color:white;}
.seen-label{text-align:right;font-size:10px;color:rgba(255,255,255,.4);margin-top:2px;padding-right:4px;}

.reply-preview{border-left:2px solid rgba(255,255,255,.5);padding:4px 8px;margin-bottom:6px;border-radius:4px;background:rgba(0,0,0,.2);font-size:11px;cursor:pointer;overflow:hidden;}
.reply-preview-name{font-weight:700;font-size:10px;margin-bottom:1px;opacity:.8;}
.reply-preview-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7;}

/* ── Vocal player ── */
.vocal-player{display:flex;align-items:center;gap:10px;min-width:200px;max-width:260px;padding:2px 0;}
.vocal-play-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.25);color:white;font-size:13px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s;}
.vocal-play-btn:active{transform:scale(.92);}
.vocal-waveform{flex:1;height:32px;display:flex;align-items:center;gap:2px;cursor:pointer;}
.vocal-bar{flex:1;border-radius:2px;background:rgba(255,255,255,.3);min-height:3px;transition:background .1s;}
.vocal-bar.played{background:rgba(255,255,255,.9);}
.vocal-bar.active{background:white;}
.vocal-duration{font-size:11px;opacity:.7;flex-shrink:0;min-width:32px;text-align:right;}

/* ── Media card ── */
.media-card{display:flex;align-items:center;gap:10px;padding:4px 0;cursor:pointer;min-width:160px;}
.media-icon{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.media-info{flex:1;}
.media-title{font-size:13px;font-weight:600;color:white;}
.media-sub{font-size:11px;color:rgba(255,255,255,.55);}
.media-arrow{font-size:16px;color:rgba(255,255,255,.4);}

/* ── Typing ── */
.typing-bubble{display:flex;gap:4px;align-items:center;padding:10px 14px;background:rgba(255,255,255,.12);border-radius:22px;border-bottom-left-radius:6px;align-self:flex-start;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);animation:bonce .9s infinite;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes bonce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}

/* ── Reply bar ── */
.reply-bar{display:none;padding:8px 14px;background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.08);flex-direction:row;align-items:center;gap:10px;flex-shrink:0;position:relative;z-index:10;}
.reply-bar.active{display:flex;}
.reply-bar-content{flex:1;min-width:0;}
.reply-bar-name{font-size:11px;font-weight:700;color:#e8547a;}
.reply-bar-text{font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reply-bar-cancel{background:none;border:none;color:rgba(255,255,255,.4);font-size:20px;cursor:pointer;}

/* ── Barre d'enregistrement ── */
.vocal-recording-bar{
  display:none;padding:12px 16px;
  background:linear-gradient(135deg,#e8547a,#c73b8a);
  flex-direction:row;align-items:center;gap:12px;
  flex-shrink:0;position:relative;z-index:10;
  border-radius:40px;margin:8px 12px;
}
.vocal-recording-bar.active{display:flex;}

.rec-pause-btn{
  width:38px;height:38px;border-radius:50%;
  background:white;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:16px;color:#e8547a;font-weight:700;
}

/* Waveform d'enregistrement */
.rec-waveform{flex:1;height:36px;display:flex;align-items:center;gap:2px;overflow:hidden;cursor:pointer;}
.rec-bar{width:3px;border-radius:2px;background:rgba(255,255,255,.6);min-height:4px;transition:height .1s;flex-shrink:0;}
.rec-timer-text{font-size:14px;font-weight:700;color:white;flex-shrink:0;min-width:36px;text-align:right;}

/* Actions sous la barre */
.vocal-recording-actions{
  display:none;padding:0 16px 12px;
  flex-direction:row;align-items:center;justify-content:space-between;
  flex-shrink:0;position:relative;z-index:10;
}
.vocal-recording-actions.active{display:flex;}
.rec-delete-btn{width:44px;height:44px;border-radius:50%;background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;}
.rec-send-btn{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#e8547a,#c73b8a);border:none;cursor:pointer;color:white;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(232,84,122,.4);}
.rec-send-btn svg{width:22px;height:22px;}

/* ── Input row ── */
.input-row{padding:10px 12px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.5);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;position:relative;z-index:10;}
.media-btn{background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;padding:6px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.media-btn:active{background:rgba(255,255,255,.1);}
.media-btn svg{width:22px;height:22px;}
.media-btn.recording{color:#e8547a;}
.input-wrap{flex:1;display:flex;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:0 14px;min-width:0;}
.msg-input{flex:1;background:none;border:none;outline:none;font-size:15px;color:white;padding:10px 0;}
.msg-input::placeholder{color:rgba(255,255,255,.35);}
.send-btn{background:none;border:none;color:#e8547a;cursor:pointer;padding:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.send-btn:disabled{opacity:.3;cursor:not-allowed;}
.send-btn svg{width:24px;height:24px;}

@keyframes highlight{
  0%{outline:3px solid rgba(232,84,122,.8);background:rgba(232,84,122,.15);}
  100%{outline:none;background:transparent;}
}
.bubble.highlighted{animation:highlight 1.5s ease;}

.upload-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:white;font-size:15px;}
.upload-overlay.active{display:flex;}
.upload-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.2);border-top-color:#e8547a;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <button class="back" onclick="location.href='friends.html'">←</button>
    <div id="friend-avatar-top"></div>
    <div class="topbar-info">
      <h2 id="chat-name"></h2>
      <div class="topbar-sub" id="chat-typing" style="display:none;">en train d'écrire...</div>
    </div>
  </div>

  <div class="messages-area" id="messages-area"></div>

  <div class="reply-bar" id="reply-bar">
    <div style="color:#e8547a;font-size:18px;">↩</div>
    <div class="reply-bar-content">
      <div class="reply-bar-name" id="reply-bar-name"></div>
      <div class="reply-bar-text" id="reply-bar-text"></div>
    </div>
    <button class="reply-bar-cancel" onclick="cancelReply()">×</button>
  </div>

  <!-- Barre enregistrement -->
  <div class="vocal-recording-bar" id="vocal-recording-bar">
    <button class="rec-pause-btn" id="rec-pause-btn" onclick="togglePausePlay()">⏸</button>
    <div class="rec-waveform" id="rec-waveform" onclick="seekPreview(event)"></div>
    <span class="rec-timer-text" id="rec-timer">0:00</span>
  </div>

  <!-- Actions -->
  <div class="vocal-recording-actions" id="vocal-recording-actions">
    <button class="rec-delete-btn" onclick="cancelRecording()">🗑️</button>
    <div style="font-size:11px;color:rgba(255,255,255,.4);text-align:center;">⏸ écouter · ➤ envoyer</div>
    <button class="rec-send-btn" onclick="sendRecording()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <div class="input-row" id="input-row">
    <button class="media-btn" onclick="pickMedia()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </button>
    <button class="media-btn" id="vocal-btn"
      onmousedown="startRecording()"
      onmouseup="onMicRelease()"
      ontouchstart="startRecording(event)"
      ontouchend="onMicRelease()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <div class="input-wrap">
      <input type="text" class="msg-input" id="msg-input"
        placeholder="Message..."
        onkeydown="onKey(event)"
        oninput="onTyping(this.value)"
        autocomplete="off"/>
    </div>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <input type="file" id="file-media" accept="image/*,video/*" style="display:none" onchange="handleFile(this)"/>
</div>

<div class="upload-overlay" id="upload-overlay">
  <div class="upload-spinner"></div>
  <span>Envoi en cours...</span>
</div>

<script>
const API    = "https://didactic-disco-q795wwrqxg45c697p-8000.app.github.dev";
const WS_URL = "wss://didactic-disco-q795wwrqxg45c697p-8000.app.github.dev/ws";

const me     = JSON.parse(localStorage.getItem('me'));
const friend = JSON.parse(localStorage.getItem('currentFriend'));
if (!me || !friend) window.location.href = 'friends.html';

document.getElementById('chat-name').textContent = `${friend.prenom} ${friend.nom}`;

const avatarTop = document.getElementById('friend-avatar-top');
if (friend.photo) {
  avatarTop.innerHTML=`<img src="${friend.photo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid rgba(255,255,255,.3);"/>`;
} else {
  const COLORS=['#e8547a','#9b59b6','#3498db','#e67e22','#2ecc71'];
  const color=COLORS[Math.abs(parseInt(friend.id||0))%COLORS.length];
  const init=((friend.prenom||'?')[0]+(friend.nom||'?')[0]).toUpperCase();
  avatarTop.innerHTML=`<div style="width:36px;height:36px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:white;border:1.5px solid rgba(255,255,255,.3);">${init}</div>`;
}

let messages=[], ws=null, seen=false, typingTimer=null, isTypingSent=false, replyingTo=null;

// ════════════════════════════════════════════
// WEBSOCKET
// ════════════════════════════════════════════
function connectWS(){
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{
    ws.send(JSON.stringify({user_id:me.id}));
    ws.send(JSON.stringify({action:'get_history',to:friend.id}));
    ws.send(JSON.stringify({action:'mark_read',to:friend.id}));
  };
  ws.onmessage=e=>{
    const data=JSON.parse(e.data);
    if(data.action==='history'){
      messages=(data.messages||[]).map(m=>({
        from:String(m.from!==undefined?m.from:m.from_user),
        text:m.text||'',media_url:m.media_url||null,media_type:m.media_type||null,
        is_vocal:m.is_vocal||false,time:m.time,msg_id:m.msg_id,
        reply_to_id:m.reply_to_id||null,reply_to_text:m.reply_to_text||null,
        reply_to_type:m.reply_to_type||null,reply_to_from:m.reply_to_from||null,
      }));
      renderMessages();
    }
    else if(data.action==='new_message'&&String(data.from)===String(friend.id)){
      messages.push({
        from:String(data.from),text:data.text||'',
        media_url:data.media_url||null,media_type:data.media_type||null,
        is_vocal:data.is_vocal||false,time:data.time,msg_id:data.msg_id,
        reply_to_id:data.reply_to_id||null,reply_to_text:data.reply_to_text||null,
        reply_to_type:data.reply_to_type||null,reply_to_from:data.reply_to_from||null,
      });
      renderMessages();
      ws.send(JSON.stringify({action:'mark_read',to:friend.id}));
    }
    else if(data.action==='typing'&&String(data.from)===String(friend.id)){showTyping(data.is_typing);}
    else if(data.action==='seen'){seen=true;renderMessages();}
    else if(data.action==='message_deleted'){
      messages=messages.filter(m=>m.msg_id!==data.msg_id);renderMessages();
    }
  };
  ws.onclose=()=>setTimeout(connectWS,3000);
}

// ════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════
function renderMessages(){
  const area=document.getElementById('messages-area');
  let lastMineIdx=-1;
  for(let i=messages.length-1;i>=0;i--){
    if(String(messages[i].from)===String(me.id)){lastMineIdx=i;break;}
  }
  area.innerHTML=messages.map((m,i)=>{
    const isMe=String(m.from)===String(me.id);
    const showSeen=isMe&&i===lastMineIdx&&seen;
    const replyHTML=m.reply_to_id?buildReplyPreview(m):'';
    const content=buildContent(m,isMe);
    return `
      <div class="bubble-wrapper ${isMe?'me':'them'}">
        <div class="bubble ${isMe?'me':'them'}" id="msg_${m.msg_id}"
          oncontextmenu="openMenu(event,${i})"
          ontouchstart="touchStart(event,${i})"
          ontouchend="touchEnd()">
          ${replyHTML}${content}
          <div class="bubble-time">${m.time||''}</div>
        </div>
        ${showSeen?'<div class="seen-label">Vu</div>':''}
      </div>`;
  }).join('');
  area.scrollTop=area.scrollHeight;

  // Waveform click seek
  document.querySelectorAll('.vocal-waveform').forEach(el=>{
    el.addEventListener('click',e=>{
      const uid=el.dataset.uid;
      const audio=document.getElementById('audio_'+uid);
      if(!audio||!audio.duration)return;
      const rect=el.getBoundingClientRect();
      audio.currentTime=((e.clientX-rect.left)/rect.width)*audio.duration;
    });
  });
}

function buildContent(m,isMe){
  if(m.media_type==='audio'){
    const uid=m.msg_id||Date.now();
    const uidStr=uid.toString();
    const bars=Array.from({length:28},(_,i)=>{
      const h=15+((uidStr.charCodeAt(i%uidStr.length)||50)*7+i*13)%65;
      return `<div class="vocal-bar" style="height:${h}%;"></div>`;
    }).join('');
    return `
      <div class="vocal-player">
        <button class="vocal-play-btn" onclick="toggleVocal('${uid}')">▶</button>
        <audio id="audio_${uid}" src="${m.media_url}" preload="auto"
          ontimeupdate="updateVocalBar('${uid}')"
          onended="resetVocal('${uid}')"></audio>
        <div class="vocal-waveform" data-uid="${uid}">${bars}</div>
        <span class="vocal-duration" id="dur_${uid}">0:00</span>
      </div>`;
  }
  if(m.media_type==='image'){
    const mJson=encodeURIComponent(JSON.stringify(m));
    return `<div class="media-card" onclick="openViewerEncoded('${mJson}')">
      <div class="media-icon">🖼️</div>
      <div class="media-info"><div class="media-title">Photo</div><div class="media-sub">Appuie pour voir</div></div>
      <div class="media-arrow">›</div></div>`;
  }
  if(m.media_type==='video'){
    const mJson=encodeURIComponent(JSON.stringify(m));
    return `<div class="media-card" onclick="openViewerEncoded('${mJson}')">
      <div class="media-icon">🎥</div>
      <div class="media-info"><div class="media-title">Vidéo</div><div class="media-sub">Appuie pour regarder</div></div>
      <div class="media-arrow">›</div></div>`;
  }
  return `<span>${m.text}</span>`;
}

// ── Audio playback dans bulle ──
function toggleVocal(uid){
  const audio=document.getElementById('audio_'+uid);
  const btn=audio?.previousElementSibling;
  if(!audio)return;
  if(audio.paused){
    document.querySelectorAll('audio').forEach(a=>{
      if(a!==audio){a.pause();resetVocalBtn(a.id.replace('audio_',''));}
    });
    audio.play().then(()=>{if(btn)btn.textContent='⏸';}).catch(()=>{});
  } else {
    audio.pause();if(btn)btn.textContent='▶';
  }
}
function updateVocalBar(uid){
  const audio=document.getElementById('audio_'+uid);
  if(!audio||!audio.duration)return;
  const pct=audio.currentTime/audio.duration;
  const played=Math.floor(pct*28);
  const waveEl=document.querySelector(`.vocal-waveform[data-uid="${uid}"]`);
  if(waveEl)waveEl.querySelectorAll('.vocal-bar').forEach((bar,i)=>{
    bar.className='vocal-bar'+(i<played?' played':i===played?' active':'');
  });
  const dur=document.getElementById('dur_'+uid);
  if(dur){const s=Math.floor(audio.currentTime);dur.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
}
function resetVocal(uid){
  resetVocalBtn(uid);
  const audio=document.getElementById('audio_'+uid);if(audio)audio.currentTime=0;
  const waveEl=document.querySelector(`.vocal-waveform[data-uid="${uid}"]`);
  if(waveEl)waveEl.querySelectorAll('.vocal-bar').forEach(b=>b.className='vocal-bar');
  const dur=document.getElementById('dur_'+uid);if(dur)dur.textContent='0:00';
}
function resetVocalBtn(uid){
  const audio=document.getElementById('audio_'+uid);
  const btn=audio?.previousElementSibling;if(btn)btn.textContent='▶';
}

// ── Viewer ──
function openViewer(m){
  localStorage.setItem('viewerMedia',JSON.stringify({
    url:m.media_url,type:m.media_type,
    from:String(m.from)===String(me.id)?'Toi':friend.prenom,
    time:m.time,isVocal:m.is_vocal||false,
  }));
  window.location.href='viewer.html';
}
function openViewerEncoded(encoded){openViewer(JSON.parse(decodeURIComponent(encoded)));}

// ── Reply preview ──
function buildReplyPreview(m){
  const fromName=m.reply_to_from===String(me.id)?'Toi':friend.prenom;
  let txt=m.reply_to_text||'';
  if(!txt){
    if(m.reply_to_type==='image')txt='📷 Photo';
    else if(m.reply_to_type==='video')txt='🎥 Vidéo';
    else if(m.reply_to_type==='audio')txt='🎵 Vocal';
  }
  return `<div class="reply-preview" onclick="scrollToMessage('${m.reply_to_id}',event)">
    <div class="reply-preview-name">${fromName}</div>
    <div class="reply-preview-text">${txt}</div></div>`;
}

// ── Scroll vers le message original — CORRIGÉ ──
function scrollToMessage(msgId, event){
  event.stopPropagation();
  // Chercher l'élément dans le DOM
  const el=document.getElementById('msg_'+msgId);
  if(!el){return;}
  // Scroll dans la zone des messages
  const area=document.getElementById('messages-area');
  const elTop=el.offsetTop;
  area.scrollTo({top:elTop-area.clientHeight/2+el.clientHeight/2, behavior:'smooth'});
  // Highlight
  el.classList.remove('highlighted');
  void el.offsetWidth; // force reflow
  el.classList.add('highlighted');
  setTimeout(()=>el.classList.remove('highlighted'),1500);
}

function cancelReply(){replyingTo=null;document.getElementById('reply-bar').classList.remove('active');}

// ── Menu contextuel ──
let touchTimer=null;
function touchStart(event,idx){touchTimer=setTimeout(()=>openMenu(null,idx),500);}

function openMenu(event,idx){
  if(event)event.preventDefault();
  const m=messages[idx];if(!m)return;
  const isMe=String(m.from)===String(me.id);
  const existing=document.getElementById('ctx-menu');if(existing)existing.remove();
  const menu=document.createElement('div');
  menu.id='ctx-menu';
  menu.style.cssText=`position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:#1a1a2e;border:1px solid rgba(255,255,255,.1);border-radius:16px;
    box-shadow:0 8px 32px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden;z-index:200;min-width:200px;`;
  const replyBtn=document.createElement('button');
  replyBtn.innerHTML='↩&nbsp;&nbsp;Répondre';
  replyBtn.style.cssText='padding:14px 20px;border:none;background:none;font-size:15px;cursor:pointer;text-align:left;color:white;border-bottom:1px solid rgba(255,255,255,.08);';
  replyBtn.onclick=()=>{
    menu.remove();
    replyingTo={msg_id:m.msg_id,from:m.from,text:m.text,media_type:m.media_type};
    const fromName=m.from===String(me.id)?'Toi':friend.prenom;
    let txt=m.text||'';
    if(!txt){if(m.media_type==='image')txt='📷 Photo';else if(m.media_type==='video')txt='🎥 Vidéo';else if(m.media_type==='audio')txt='🎵 Vocal';}
    document.getElementById('reply-bar-name').textContent=fromName;
    document.getElementById('reply-bar-text').textContent=txt;
    document.getElementById('reply-bar').classList.add('active');
    document.getElementById('msg-input').focus();
  };
  menu.appendChild(replyBtn);
  if(isMe){
    const deleteBtn=document.createElement('button');
    deleteBtn.innerHTML='🗑&nbsp;&nbsp;Supprimer';
    deleteBtn.style.cssText='padding:14px 20px;border:none;background:none;font-size:15px;cursor:pointer;text-align:left;color:#e74c3c;border-bottom:1px solid rgba(255,255,255,.08);';
    deleteBtn.onclick=()=>{menu.remove();deleteMessage(m.msg_id);};
    menu.appendChild(deleteBtn);
  }
  const cancelBtn=document.createElement('button');
  cancelBtn.textContent='Annuler';
  cancelBtn.style.cssText='padding:14px 20px;border:none;background:none;font-size:15px;cursor:pointer;color:rgba(255,255,255,.4);';
  cancelBtn.onclick=()=>menu.remove();
  menu.appendChild(cancelBtn);
  document.body.appendChild(menu);
  setTimeout(()=>{document.addEventListener('click',()=>menu.remove(),{once:true});},100);
}

function deleteMessage(msgId){
  ws?.send(JSON.stringify({action:'delete_message',to:friend.id,msg_id:msgId}));
  messages=messages.filter(m=>m.msg_id!==msgId);renderMessages();
}

// ── Envoyer texte ──
function sendMessage(){
  const input=document.getElementById('msg-input');
  const text=input.value.trim();if(!text)return;
  const now=new Date(),time=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  const msgId=`${me.id}_${Date.now()}`;
  messages.push({from:String(me.id),text,media_url:null,media_type:null,is_vocal:false,time,msg_id:msgId,
    reply_to_id:replyingTo?.msg_id||null,reply_to_text:replyingTo?.text||null,
    reply_to_type:replyingTo?.media_type||null,reply_to_from:replyingTo?.from||null});
  seen=false;renderMessages();input.value='';
  ws?.send(JSON.stringify({action:'send_message',to:friend.id,text,
    reply_to_id:replyingTo?.msg_id||null,reply_to_text:replyingTo?.text||null,
    reply_to_type:replyingTo?.media_type||null,reply_to_from:replyingTo?.from||null}));
  cancelReply();clearTypingState();
}

// ── Upload ──
async function uploadAndSend(file,isVocal=false){
  document.getElementById('upload-overlay').classList.add('active');
  document.getElementById('send-btn').disabled=true;
  try{
    const fd=new FormData();fd.append('file',file);
    const res=await fetch(`${API}/upload`,{method:'POST',body:fd});
    const data=await res.json();
    if(!data.url){alert('Erreur upload.');return;}
    const now=new Date(),time=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
    const msgId=`${me.id}_${Date.now()}`;
    messages.push({from:String(me.id),text:'',media_url:data.url,media_type:data.media_type,
      is_vocal:isVocal,time,msg_id:msgId,
      reply_to_id:replyingTo?.msg_id||null,reply_to_text:replyingTo?.text||null,
      reply_to_type:replyingTo?.media_type||null,reply_to_from:replyingTo?.from||null});
    seen=false;renderMessages();
    ws?.send(JSON.stringify({action:'send_message',to:friend.id,text:'',
      media_url:data.url,media_type:data.media_type,is_vocal:isVocal,
      reply_to_id:replyingTo?.msg_id||null,reply_to_text:replyingTo?.text||null,
      reply_to_type:replyingTo?.media_type||null,reply_to_from:replyingTo?.from||null}));
    cancelReply();
  }catch(e){alert('Erreur réseau.');}
  finally{
    document.getElementById('upload-overlay').classList.remove('active');
    document.getElementById('send-btn').disabled=false;
  }
}

function pickMedia(){document.getElementById('file-media').click();}
function handleFile(input){if(input.files[0]){uploadAndSend(input.files[0]);input.value='';}}

// ════════════════════════════════════════════
// ENREGISTREMENT VOCAL
// ════════════════════════════════════════════
let mediaRecorder=null, audioChunks=[], recordingStream=null;
let recTimerInterval=null, recSeconds=0, recWaveInterval=null;
let pendingBlob=null, pendingBlobUrl=null;
let recState='idle'; // idle | recording | paused | previewing

function initRecWaveform(){
  const waveEl=document.getElementById('rec-waveform');
  waveEl.innerHTML='';
  for(let i=0;i<40;i++){
    const bar=document.createElement('div');
    bar.className='rec-bar';bar.style.height='8px';
    waveEl.appendChild(bar);
  }
}

function animateRecWaveform(){
  if(recState!=='recording')return;
  document.querySelectorAll('.rec-bar').forEach(bar=>{
    const h=4+Math.random()*28;
    bar.style.height=h+'px';
    bar.style.background=Math.random()>.5?'rgba(255,255,255,.9)':'rgba(255,255,255,.4)';
  });
}

async function startRecording(e){
  if(e)e.preventDefault();
  if(recState!=='idle')return;
  try{
    recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mimeType=MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':
                   MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'';
    mediaRecorder=mimeType?new MediaRecorder(recordingStream,{mimeType}):new MediaRecorder(recordingStream);
    audioChunks=[];recSeconds=0;pendingBlob=null;pendingBlobUrl=null;

    mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};
    mediaRecorder.onstop=()=>{
      recordingStream.getTracks().forEach(t=>t.stop());
      const finalType=mediaRecorder.mimeType||'audio/webm';
      const finalExt=finalType.includes('mp4')?'mp4':'webm';
      pendingBlob=new Blob(audioChunks,{type:finalType});
      pendingBlob._ext=finalExt;
      pendingBlob._type=finalType;
      // Créer URL pour écoute locale
      if(pendingBlobUrl)URL.revokeObjectURL(pendingBlobUrl);
      pendingBlobUrl=URL.createObjectURL(pendingBlob);
    };

    mediaRecorder.start(100);
    recState='recording';

    initRecWaveform();
    document.getElementById('vocal-recording-bar').classList.add('active');
    document.getElementById('vocal-recording-actions').classList.add('active');
    document.getElementById('input-row').style.display='none';
    document.getElementById('rec-pause-btn').textContent='⏸';

    recTimerInterval=setInterval(()=>{
      if(recState==='recording'){
        recSeconds++;
        const m=Math.floor(recSeconds/60),s=recSeconds%60;
        document.getElementById('rec-timer').textContent=`${m}:${String(s).padStart(2,'0')}`;
      }
    },1000);
    recWaveInterval=setInterval(animateRecWaveform,100);
    document.getElementById('vocal-btn').classList.add('recording');

  }catch(e){alert('Accès au microphone refusé.');}
}

// Relâcher le bouton micro — ne fait rien, on garde la barre
function onMicRelease(){}

// ── Bouton ⏸/▶ — pause écoute / reprend enregistrement ──
function togglePausePlay(){
  const btn=document.getElementById('rec-pause-btn');

  if(recState==='recording'){
    // Mettre en pause l'enregistrement → passer en mode écoute
    mediaRecorder.stop(); // finalise le blob
    recState='paused';
    btn.textContent='🔴';
    // Figer les barres
    document.querySelectorAll('.rec-bar').forEach(bar=>{
      bar.style.height='8px';
      bar.style.background='rgba(255,255,255,.3)';
    });
    // Après onstop, on peut jouer
    setTimeout(()=>{
      if(pendingBlobUrl){
        playPreview();
      }
    },200);
  }
  else if(recState==='paused'||recState==='previewing'){
    // Stopper la preview et reprendre l'enregistrement
    stopPreview();
    resumeRecording();
  }
}

// ── Jouer le preview de l'enregistrement ──
let previewAudio=null;
function playPreview(){
  if(!pendingBlobUrl)return;
  recState='previewing';
  const btn=document.getElementById('rec-pause-btn');
  btn.textContent='⏹';

  if(previewAudio){previewAudio.pause();previewAudio=null;}
  previewAudio=new Audio(pendingBlobUrl);
  previewAudio.play().then(()=>{
    // Animer les barres selon la progression
    const updatePreviewBars=setInterval(()=>{
      if(!previewAudio||previewAudio.paused){clearInterval(updatePreviewBars);return;}
      const pct=previewAudio.currentTime/(previewAudio.duration||1);
      const played=Math.floor(pct*40);
      document.querySelectorAll('.rec-bar').forEach((bar,i)=>{
        bar.style.height=i<played?'20px':'8px';
        bar.style.background=i<played?'rgba(255,255,255,.9)':'rgba(255,255,255,.3)';
      });
      const s=Math.floor(previewAudio.currentTime);
      document.getElementById('rec-timer').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    },100);
    previewAudio.onended=()=>{
      clearInterval(updatePreviewBars);
      recState='paused';
      btn.textContent='🔴';
    };
  }).catch(()=>{recState='paused';btn.textContent='🔴';});
}

function stopPreview(){
  if(previewAudio){previewAudio.pause();previewAudio.onended=null;previewAudio=null;}
}

// ── Reprendre l'enregistrement après pause ──
async function resumeRecording(){
  try{
    recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mimeType=MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':
                   MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'';
    const newRecorder=mimeType?new MediaRecorder(recordingStream,{mimeType}):new MediaRecorder(recordingStream);
    const newChunks=[];

    newRecorder.ondataavailable=e=>{if(e.data.size>0)newChunks.push(e.data);};
    newRecorder.onstop=()=>{
      recordingStream.getTracks().forEach(t=>t.stop());
      // Fusionner ancien blob + nouveaux chunks
      const finalType=newRecorder.mimeType||'audio/webm';
      const finalExt=finalType.includes('mp4')?'mp4':'webm';
      const newBlob=new Blob(newChunks,{type:finalType});
      // Combiner les deux blobs
      const combined=new Blob([pendingBlob,newBlob],{type:finalType});
      combined._ext=finalExt;
      combined._type=finalType;
      pendingBlob=combined;
      if(pendingBlobUrl)URL.revokeObjectURL(pendingBlobUrl);
      pendingBlobUrl=URL.createObjectURL(pendingBlob);
    };

    newRecorder.start(100);
    mediaRecorder=newRecorder;
    recState='recording';
    document.getElementById('rec-pause-btn').textContent='⏸';
    // Reprendre l'animation
  }catch(e){console.error(e);}
}

// ── Seek dans le preview ──
function seekPreview(e){
  if(recState!=='previewing'||!previewAudio||!previewAudio.duration)return;
  const rect=e.currentTarget.getBoundingClientRect();
  previewAudio.currentTime=((e.clientX-rect.left)/rect.width)*previewAudio.duration;
}

function hideRecordingBar(){
  stopPreview();
  document.getElementById('vocal-recording-bar').classList.remove('active');
  document.getElementById('vocal-recording-actions').classList.remove('active');
  document.getElementById('input-row').style.display='flex';
  document.getElementById('rec-timer').textContent='0:00';
  document.getElementById('rec-pause-btn').textContent='⏸';
  clearInterval(recTimerInterval);
  clearInterval(recWaveInterval);
  document.getElementById('vocal-btn').classList.remove('recording');
  recState='idle';
  if(pendingBlobUrl){URL.revokeObjectURL(pendingBlobUrl);pendingBlobUrl=null;}
}

// ── Envoyer — indépendant de l'état ──
async function sendRecording(){
  // Arrêter si en cours
  stopPreview();
  if(mediaRecorder&&mediaRecorder.state!=='inactive'){
    await new Promise(resolve=>{
      const orig=mediaRecorder.onstop;
      mediaRecorder.onstop=(...args)=>{orig?.(...args);resolve();};
      mediaRecorder.stop();
      recordingStream?.getTracks().forEach(t=>t.stop());
    });
  }
  // Attendre un peu pour que onstop soit appelé
  await new Promise(r=>setTimeout(r,150));

  hideRecordingBar();
  if(!pendingBlob||pendingBlob.size<500)return;
  const blob=pendingBlob;
  pendingBlob=null;
  const file=new File([blob],`vocal_${Date.now()}.${blob._ext}`,{type:blob._type});
  await uploadAndSend(file,true);
}

// ── Annuler ──
function cancelRecording(){
  stopPreview();
  if(mediaRecorder&&mediaRecorder.state!=='inactive'){
    mediaRecorder.onstop=()=>{};
    mediaRecorder.stop();
    recordingStream?.getTracks().forEach(t=>t.stop());
  }
  pendingBlob=null;
  hideRecordingBar();
}

// ── Typing ──
function onTyping(text){
  if(!text){ws?.send(JSON.stringify({action:'typing',to:friend.id,is_typing:false}));isTypingSent=false;clearTimeout(typingTimer);return;}
  if(!isTypingSent){ws?.send(JSON.stringify({action:'typing',to:friend.id,is_typing:true}));isTypingSent=true;}
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>{ws?.send(JSON.stringify({action:'typing',to:friend.id,is_typing:false}));isTypingSent=false;},2000);
}
function clearTypingState(){clearTimeout(typingTimer);ws?.send(JSON.stringify({action:'typing',to:friend.id,is_typing:false}));isTypingSent=false;}
function showTyping(isTyping){
  document.getElementById('chat-typing').style.display=isTyping?'block':'none';
  const area=document.getElementById('messages-area');
  let tb=document.getElementById('typing-bubble');
  if(isTyping&&!tb){tb=document.createElement('div');tb.id='typing-bubble';tb.className='typing-bubble';tb.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';area.appendChild(tb);area.scrollTop=area.scrollHeight;}
  else if(!isTyping&&tb)tb.remove();
}
