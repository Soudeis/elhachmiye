<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
   <script src="audio-player.js"></script>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#1e90ff"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ChatApp"/>
<link rel="apple-touch-icon" href="icon.png"/>
   <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<title>Paramètres</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;font-family:Arial,sans-serif;background:#f0f2f5;}
body{display:flex;justify-content:center;}
.shell{width:100%;max-width:480px;background:white;min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:#1e90ff;color:white;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.back{cursor:pointer;font-size:22px;background:none;border:none;color:white;padding:4px 8px 4px 0;}
.topbar h2{font-size:16px;margin:0;}
.content{padding:24px 20px;display:flex;flex-direction:column;gap:20px;}
.avatar-section{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 0;}
.avatar-circle{width:100px;height:100px;border-radius:50%;overflow:hidden;cursor:pointer;border:3px dashed #ddd;display:flex;align-items:center;justify-content:center;transition:.2s;background:#f0f0f0;}
.avatar-circle:hover{border-color:#1e90ff;}
.avatar-circle img{width:100%;height:100%;object-fit:cover;}
.avatar-label{font-size:13px;color:#1e90ff;cursor:pointer;font-weight:600;}
.section-title{font-size:13px;color:#999;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.input-group{display:flex;flex-direction:column;gap:10px;}
.input-group input{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;outline:none;transition:.2s;}
.input-group input:focus{border-color:#1e90ff;}
.btn-primary{background:#1e90ff;color:white;border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;width:100%;}
.btn-primary:disabled{background:#aaa;cursor:not-allowed;}
.btn-danger{background:none;color:#e74c3c;border:1.5px solid #e74c3c;padding:14px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;width:100%;}
.err{color:#c0392b;font-size:13px;display:none;padding:8px 12px;background:#fdf0f0;border-radius:8px;}
.ok-msg{color:#27ae60;font-size:13px;display:none;padding:8px 12px;background:#f0fdf4;border-radius:8px;}
.divider{height:1px;background:#f0f0f0;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <button class="back" onclick="location.href='friends.html'">←</button>
    <h2>Paramètres</h2>
  </div>

  <div class="content">

    <!-- ── Photo de profil ── -->
    <div class="avatar-section">
      <div class="avatar-circle" id="avatar-preview" onclick="document.getElementById('avatar-input').click()">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <span class="avatar-label" onclick="document.getElementById('avatar-input').click()">Changer la photo</span>
      <input type="file" id="avatar-input" accept="image/*" style="display:none" onchange="previewAvatar(this)"/>
    </div>

    <div class="divider"></div>

    <!-- ── Nom & Prénom ── -->
    <div>
      <div class="section-title">Informations</div>
      <div class="input-group" style="margin-top:10px;">
        <input type="text" id="set-nom" placeholder="Nom"/>
        <input type="text" id="set-prenom" placeholder="Prénom"/>
        <div class="err" id="profile-err"></div>
        <div class="ok-msg" id="profile-ok">Profil mis à jour !</div>
        <button class="btn-primary" onclick="saveProfile()">Enregistrer</button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- ── Mot de passe ── -->
    <div>
      <div class="section-title">Mot de passe</div>
      <div class="input-group" style="margin-top:10px;">
        <input type="password" id="old-pass" placeholder="Ancien mot de passe"/>
        <input type="password" id="new-pass" placeholder="Nouveau mot de passe"/>
        <input type="password" id="confirm-pass" placeholder="Confirmer le nouveau mot de passe"/>
        <div class="err" id="pass-err"></div>
        <div class="ok-msg" id="pass-ok">Mot de passe modifié !</div>
        <button class="btn-primary" onclick="savePassword()">Modifier le mot de passe</button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- ── Déconnexion ── -->
    <button class="btn-danger" onclick="doLogout()">Se déconnecter</button>

  </div>
</div>

<script>
const API = "https://didactic-disco-q795wwrqxg45c697p-8000.app.github.dev";

let me = JSON.parse(localStorage.getItem('me'));
if (!me) window.location.href = 'index.html';

// Remplir les champs avec les infos actuelles
document.getElementById('set-nom').value    = me.nom    || '';
document.getElementById('set-prenom').value = me.prenom || '';

// Afficher la photo actuelle
const preview = document.getElementById('avatar-preview');
if (me.photo) {
  preview.innerHTML = `<img src="${me.photo}"/>`;
  preview.style.border = '3px solid #1e90ff';
}

let newPhotoFile = null;

function showErr(id, msg) { const el=document.getElementById(id); el.textContent=msg; el.style.display='block'; }
function hideEl(id)       { const el=document.getElementById(id); if(el)el.style.display='none'; }
function showOk(id)       { const el=document.getElementById(id); el.style.display='block'; setTimeout(()=>el.style.display='none', 3000); }

async function api(method, path, body) {
  const opts = { method, headers:{'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  try { return (await fetch(API+path, opts)).json(); }
  catch(e) { return {}; }
}

// ── Preview photo ──
function previewAvatar(input) {
  if (!input.files[0]) return;
  newPhotoFile = input.files[0];
  const reader = new FileReader();
  reader.onload = e => {
    preview.innerHTML = `<img src="${e.target.result}"/>`;
    preview.style.border = '3px solid #1e90ff';
  };
  reader.readAsDataURL(input.files[0]);
}

// ── Upload avatar ──
async function uploadAvatar(file) {
  const fd = new FormData();
  fd.append('file', file);
  const res  = await fetch(`${API}/upload-avatar`, { method:'POST', body:fd });
  const data = await res.json();
  return data.url || null;
}

// ── Sauvegarder le profil (nom, prénom, photo) ──
async function saveProfile() {
  const nom    = document.getElementById('set-nom').value.trim();
  const prenom = document.getElementById('set-prenom').value.trim();
  hideEl('profile-err'); hideEl('profile-ok');

  if (!nom||!prenom) { showErr('profile-err','Remplis tous les champs.'); return; }

  const btn = document.querySelectorAll('.btn-primary')[0];
  btn.disabled=true; btn.textContent='Enregistrement...';

  // Upload nouvelle photo si choisie
  let photoUrl = me.photo || null;
  if (newPhotoFile) {
    btn.textContent = 'Upload photo...';
    photoUrl = await uploadAvatar(newPhotoFile);
    newPhotoFile = null;
  }

  const data = await api('POST', '/update-profile', {
    user_id: me.id, nom, prenom, photo: photoUrl
  });

  btn.disabled=false; btn.textContent='Enregistrer';

  if (!data.ok) { showErr('profile-err','Erreur lors de la mise à jour.'); return; }

  // Mettre à jour le localStorage
  me = data.user;
  localStorage.setItem('me', JSON.stringify(me));
  showOk('profile-ok');
}

// ── Modifier le mot de passe ──
async function savePassword() {
  const oldPass     = document.getElementById('old-pass').value;
  const newPass     = document.getElementById('new-pass').value;
  const confirmPass = document.getElementById('confirm-pass').value;
  hideEl('pass-err'); hideEl('pass-ok');

  if (!oldPass||!newPass||!confirmPass) { showErr('pass-err','Remplis tous les champs.'); return; }
  if (newPass !== confirmPass) { showErr('pass-err','Les mots de passe ne correspondent pas.'); return; }
  if (newPass.length < 6) { showErr('pass-err','Le mot de passe doit faire au moins 6 caractères.'); return; }

  const btn = document.querySelectorAll('.btn-primary')[1];
  btn.disabled=true; btn.textContent='Modification...';

  const data = await api('POST', '/update-password', {
    user_id: me.id, old_password: oldPass, new_password: newPass
  });

  btn.disabled=false; btn.textContent='Modifier le mot de passe';

  if (!data.ok) { showErr('pass-err', data.msg||'Erreur.'); return; }

  document.getElementById('old-pass').value = '';
  document.getElementById('new-pass').value = '';
  document.getElementById('confirm-pass').value = '';
  showOk('pass-ok');
}

function doLogout() {
  localStorage.clear();
  window.location.href = 'index.html';
}
</script>
</body>
</html>
